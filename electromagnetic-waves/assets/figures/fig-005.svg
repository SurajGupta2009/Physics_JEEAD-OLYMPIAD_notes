<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Integrate force directions over the hemisphere</title><desc id="desc">The annulus area and inward normal show the extra axial projection for a locally specular sphere.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#172b40}.small{font-size:14px}.title{font-size:23px;font-weight:bold}.axis{stroke:#334155;stroke-width:2;fill:none}.blue{stroke:#176ba0;stroke-width:3;fill:none}.red{stroke:#c3473a;stroke-width:3;fill:none}.dash{stroke-dasharray:7 5}.note{fill:#486176}</style><rect width="900" height="440" fill="#fafcfb"/><text x="28" y="38" class="title">Integrate force directions over the hemisphere</text><circle cx="400" cy="228" r="132" fill="#e3edf4" stroke="#8099ad" stroke-width="2"/><line x1="60" y1="132" x2="306.401986776751" y2="132" class="blue" marker-end="url(#arrow)"/><line x1="60" y1="180" x2="274.0365908084848" y2="180" class="blue" marker-end="url(#arrow)"/><line x1="60" y1="228" x2="265.0" y2="228" class="blue" marker-end="url(#arrow)"/><line x1="60" y1="276" x2="274.0365908084848" y2="276" class="blue" marker-end="url(#arrow)"/><line x1="60" y1="324" x2="306.401986776751" y2="324" class="blue" marker-end="url(#arrow)"/><ellipse cx="306.66" cy="228" rx="15" ry="93.34" fill="none" stroke="#c3473a" stroke-width="3"/><line x1="306.6619048833757" y1="134.66190488337574" x2="400" y2="228" class="red" marker-end="url(#arrow)"/><line x1="306.6619048833757" y1="134.66190488337574" x2="426.6619048833757" y2="134.66190488337574" class="axis dash"/><text x="354.6619048833757" y="157.66190488337574" class="">θ</text><line x1="400" y1="228" x2="545" y2="228" class="axis" marker-end="url(#arrow)"/><text x="520" y="256" class="">+z</text><text x="363" y="187" class="">a</text><text x="47" y="101" class="">uniform I</text><text x="566" y="109" class="">Illuminated annulus:</text><text x="566" y="146" class="">dA = 2πa² sin θ dθ</text><text x="566" y="197" class="">Absorber: dFz ∝ cos θ</text><text x="566" y="237" class="">Mirror: dFz ∝ 2 cos³ θ</text><text x="566" y="287" class="">Both: Fz = Iπa²/c</text><text x="153" y="407" class="">Transverse components cancel by axial symmetry; a sphere is not a disk.</text></svg>
