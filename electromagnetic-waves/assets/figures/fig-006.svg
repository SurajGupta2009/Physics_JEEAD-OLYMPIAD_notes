<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc"><title id="title">One spectrum, many source mechanisms</title><desc id="desc">Radio through gamma ordering with explicit conventional dividing wavelengths and opposite wavelength/frequency arrows.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#172b40}.small{font-size:14px}.title{font-size:23px;font-weight:bold}.axis{stroke:#334155;stroke-width:2;fill:none}.blue{stroke:#176ba0;stroke-width:3;fill:none}.red{stroke:#c3473a;stroke-width:3;fill:none}.dash{stroke-dasharray:7 5}.note{fill:#486176}</style><rect width="900" height="455" fill="#fafcfb"/><text x="28" y="38" class="title">One spectrum, many source mechanisms</text><text x="30" y="88" class="note">Schematic band order — widths are not proportional to log frequency</text><rect x="30" y="150" width="120" height="92" fill="#d8e9f6" stroke="#fff"/><text x="38" y="201" class="">Radio</text><rect x="150" y="150" width="120" height="92" fill="#b4d6ed" stroke="#fff"/><text x="158" y="201" class="">Microwave</text><rect x="270" y="150" width="120" height="92" fill="#f4cbaa" stroke="#fff"/><text x="278" y="201" class="">Infrared</text><rect x="390" y="150" width="120" height="92" fill="#c7ddae" stroke="#fff"/><text x="398" y="201" class="">Visible</text><rect x="510" y="150" width="120" height="92" fill="#cbbfe7" stroke="#fff"/><text x="518" y="201" class="">Ultraviolet</text><rect x="630" y="150" width="120" height="92" fill="#a5bbd8" stroke="#fff"/><text x="638" y="201" class="">X-ray</text><rect x="750" y="150" width="120" height="92" fill="#9bacc2" stroke="#fff"/><text x="758" y="201" class="">Gamma</text><line x1="150" y1="242" x2="150" y2="270" class="axis"/><text x="123" y="289" class="small">1 m</text><line x1="270" y1="242" x2="270" y2="294" class="axis"/><text x="243" y="315" class="small">1 mm</text><line x1="390" y1="242" x2="390" y2="270" class="axis"/><text x="363" y="289" class="small">700 nm</text><line x1="510" y1="242" x2="510" y2="294" class="axis"/><text x="483" y="315" class="small">400 nm</text><line x1="630" y1="242" x2="630" y2="270" class="axis"/><text x="603" y="289" class="small">10 nm</text><line x1="750" y1="242" x2="750" y2="294" class="axis"/><text x="723" y="315" class="small">0.01 nm</text><line x1="70" y1="115" x2="826" y2="115" class="axis" marker-end="url(#arrow)"/><text x="268" y="106" class="">frequency and photon energy increase</text><line x1="827" y1="355" x2="70" y2="355" class="axis" marker-end="url(#arrow)"/><text x="303" y="384" class="">vacuum wavelength increases</text><text x="66" y="423" class="note">Adopted boundaries; origin-based X-ray and gamma labels overlap.</text></svg>
