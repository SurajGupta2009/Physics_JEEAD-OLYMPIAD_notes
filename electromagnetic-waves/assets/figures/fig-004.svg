<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Oblique pressure has two different projections</title><desc id="desc">The ray angle is measured from the normal. Reflection preserves tangential and reverses normal momentum.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#172b40}.small{font-size:14px}.title{font-size:23px;font-weight:bold}.axis{stroke:#334155;stroke-width:2;fill:none}.blue{stroke:#176ba0;stroke-width:3;fill:none}.red{stroke:#c3473a;stroke-width:3;fill:none}.dash{stroke-dasharray:7 5}.note{fill:#486176}</style><rect width="900" height="440" fill="#fafcfb"/><text x="28" y="38" class="title">Oblique pressure has two different projections</text><rect x="170" y="308" width="570" height="20" fill="#9aacba"/><line x1="450" y1="100" x2="450" y2="307" class="axis dash"/><line x1="222" y1="80" x2="450" y2="307" class="blue" marker-end="url(#arrow)"/><line x1="450" y1="307" x2="678" y2="80" class="blue" marker-end="url(#arrow)"/><path d="M450 246 A61 61 0 0 0 407 264" class="red"/><text x="422" y="242" class="">θ</text><text x="189" y="71" class="">incident</text><text x="660" y="71" class="">reflected</text><text x="461" y="131" class="">normal</text><text x="559" y="351" class="">stationary mirror</text><line x1="285" y1="169" x2="365" y2="169" class="red" marker-end="url(#arrow)"/><line x1="365" y1="169" x2="365" y2="249" class="red" marker-end="url(#arrow)"/><text x="236" y="154" class="">tangent</text><text x="372" y="210" class="">normal</text><text x="53" y="395" class="">Power intercepted = I A cos θ; normal momentum per energy = cos θ / c</text></svg>
