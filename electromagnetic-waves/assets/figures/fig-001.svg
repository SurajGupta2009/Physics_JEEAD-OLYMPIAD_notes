<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">One loop, two spanning surfaces</title><desc id="desc">A disk through the wire and a bulged surface into the capacitor gap share the same rim.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#172b40}.small{font-size:14px}.title{font-size:23px;font-weight:bold}.axis{stroke:#334155;stroke-width:2;fill:none}.blue{stroke:#176ba0;stroke-width:3;fill:none}.red{stroke:#c3473a;stroke-width:3;fill:none}.dash{stroke-dasharray:7 5}.note{fill:#486176}</style><rect width="900" height="440" fill="#fafcfb"/><text x="28" y="38" class="title">One loop, two spanning surfaces</text><ellipse cx="230" cy="215" rx="42" ry="105" fill="#dcecf4" stroke="#176ba0" stroke-width="2"/><path d="M230 110 C410 65 595 85 600 215 C595 345 410 365 230 320" fill="#e4f3e9" fill-opacity="0.65" stroke="#389469" stroke-width="2" stroke-dasharray="7 5"/><ellipse cx="230" cy="215" rx="42" ry="105" fill="none" stroke="#176ba0" stroke-width="3"/><line x1="55" y1="215" x2="432" y2="215" class="axis" marker-end="url(#arrow)"/><line x1="672" y1="215" x2="840" y2="215" class="axis" marker-end="url(#arrow)"/><rect x="435" y="105" width="12" height="220" fill="#8195a4"/><rect x="665" y="105" width="12" height="220" fill="#8195a4"/><line x1="460" y1="145" x2="647" y2="145" class="red" marker-end="url(#arrow)"/><line x1="460" y1="185" x2="647" y2="185" class="red" marker-end="url(#arrow)"/><line x1="460" y1="245" x2="647" y2="245" class="red" marker-end="url(#arrow)"/><line x1="460" y1="285" x2="647" y2="285" class="red" marker-end="url(#arrow)"/><text x="72" y="196" class="">I_c</text><text x="191" y="92" class="">Same loop C</text><text x="74" y="351" class="">Surface 1: cuts wire</text><text x=