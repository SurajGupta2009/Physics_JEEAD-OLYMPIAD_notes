<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 330" role="img" aria-label="Light entering an optical fibre inside the acceptance cone and zigzagging down the core by total internal reflection" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <rect x="180" y="130" width="640" height="60" fill="var(--accent-soft)" stroke="none"></rect>
  <rect x="180" y="90" width="640" height="40" fill="none" stroke="var(--rule)"></rect>
  <rect x="180" y="190" width="640" height="40" fill="none" stroke="var(--rule)"></rect>
  <line x1="180" y1="90" x2="820" y2="90" class="ln2"></line>
  <line x1="180" y1="130" x2="820" y2="130" class="ln2"></line>
  <line x1="180" y1="190" x2="820" y2="190" class="ln2"></line>
  <line x1="180" y1="230" x2="820" y2="230" class="ln2"></line>
  <line x1="180" y1="90" x2="180" y2="230" class="ln2"></line>
  <text x="196" y="118" class="lbl sm" text-anchor="start">cladding <tspan class="mi">n₂ = 1.48</tspan></text>
  <text x="196" y="166" class="lbl sm" text-anchor="start">core <tspan class="mi">n₁ = 1.50</tspan></text>
  <text x="196" y="214" class="lbl sm" text-anchor="start">cladding <tspan class="mi">n₂ = 1.48</tspan></text>
  <line x1="60" y1="126" x2="180" y2="156" class="ln" stroke="var(--accent)"></line>
  <line x1="180" y1="156" x2="386" y2="190" class="ln" stroke="var(--accent)"></line>
  <line x1="386" y1="190" x2="750" y2="130" class="ln" stroke="var(--accent)"></line>
  <line x1="750" y1="130" x2="810" y2="140" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <circle cx="386" cy="190" r="4" class="eq0"></circle>
  <circle cx="750" cy="130" r="4" class="eq0"></circle>
  <text x="392" y="212" class="lbl sm" text-anchor="start">TIR at 80.6° = <tspan class="mi">C</tspan> (marginal ray)</text>
  <line x1="60" y1="130" x2="180" y2="160" class="thinl" stroke-dasharray="6 4"></line>
  <line x1="60" y1="190" x2="180" y2="160" class="thinl" stroke-dasharray="6 4"></line>
  <path d="M120,160 a45,45 0 0 1 4,-18" class="thinl" fill="none"></path>
  <path d="M120,160 a45,45 0 0 0 -4,18" class="thinl" fill="none"></path>
  <text x="128" y="152" class="mi sm">θmax</text>
  <text x="120" y="188" class="mi sm">θmax</text>
  <text x="120" y="246" class="lbl sm" text-anchor="middle">acceptance cone:</text>
  <text x="120" y="262" class="lbl sm" text-anchor="middle">sin <tspan class="mi">θmax = √(n₁² − n₂²) = 0.244</tspan></text>
  <text x="120" y="278" class="lbl sm" text-anchor="middle">θmax = 14.1°</text>
  <text x="620" y="286" class="lbl sm" text-anchor="middle">inside, the steepest ray makes 9.4° with the axis —</text>
  <text x="620" y="302" class="lbl sm" text-anchor="middle">and so meets the wall at 90° − 9.4° = 80.6° = <tspan class="mi">C</tspan> exactly</text>
</svg>
