<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="Three parallel rays striking a concave spherical mirror at different heights and crossing the axis at three different points, showing spherical aberration" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <path d="M305.9,93.4 A100,100 0 0 1 305.9,286.6" class="ln2" fill="none"></path>
  <line x1="100" y1="190" x2="840" y2="190" class="dim"></line>
  <text x="120" y="182" class="lbl sm" text-anchor="start">principal axis</text>
  <circle cx="280" cy="190" r="3" class="eq0"></circle>
  <text x="276" y="212" class="mi sm" text-anchor="end">C</text>
  <line x1="100" y1="130" x2="360" y2="130" class="ln" stroke="var(--accent)"></line>
  <line x1="100" y1="150" x2="371.7" y2="150" class="ln" stroke="var(--accent)"></line>
  <line x1="100" y1="170" x2="378" y2="170" class="ln" stroke="var(--accent)"></line>
  <line x1="360" y1="130" x2="334.6" y2="217" class="ln" stroke="var(--neg)"></line>
  <line x1="371.7" y1="150" x2="314.2" y2="212" class="ln" stroke="var(--neg)"></line>
  <line x1="378" y1="170" x2="302.8" y2="202" class="ln" stroke="var(--neg)"></line>
  <circle cx="360" cy="130" r="3.5" class="eq0"></circle><circle cx="371.7" cy="150" r="3.5" class="eq0"></circle><circle cx="378" cy="170" r="3.5" class="eq0"></circle>
  <circle cx="342.5" cy="190" r="3.5" class="eq0"></circle><circle cx="334.6" cy="190" r="3.5" class="eq0"></circle><circle cx="331" cy="190" r="3.5" class="eq0"></circle>
  <circle cx="330" cy="190" r="5" fill="none" stroke="var(--rule)"></circle>
  <text x="330" y="232" class="lbl sm" text-anchor="middle">paraxial focus, R/2</text>
  <text x="352" y="252" class="lbl sm" text-anchor="start">the three crossings</text>
  <text x="352" y="268" class="lbl sm" text-anchor="start">march in toward the mirror</text>
  <text x="150" y="112" class="lbl sm" text-anchor="start">parallel rays from a distant star</text>
  <text x="470" y="130" class="lbl sm" text-anchor="start">height <tspan class="mi">h</tspan> = 6 cm, 4 cm, 2 cm (drawing: R = 20 cm = 100 px)</text>
  <text x="470" y="150" class="lbl sm" text-anchor="start">crossings at 8.5, 8.9, 9.9 cm from the pole</text>
  <text x="470" y="170" class="lbl sm" text-anchor="start">— the paraxial focus is at 10.0 cm</text>
  <text x="470" y="218" class="lbl sm" text-anchor="start">only the central few centimetres of a spherical</text>
  <text x="470" y="234" class="lbl sm" text-anchor="start">mirror behave paraxially: the aberration grows as</text>
  <text x="470" y="250" class="lbl sm" text-anchor="start"><tspan class="mi">h²</tspan> (longitudinal) and <tspan class="mi">h³</tspan> (transverse)</text>
</svg>
