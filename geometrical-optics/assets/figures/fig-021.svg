<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 330" role="img" aria-label="Rays leaving glass into air: refracting below the critical angle, grazing at the critical angle, and totally reflecting beyond it" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <rect x="60" y="170" width="740" height="140" class="w ln" fill="var(--accent-soft)" stroke="none"></rect>
  <line x1="60" y1="170" x2="800" y2="170" class="ln2"></line>
  <text x="90" y="196" class="lbl sm" text-anchor="start">glass, <tspan class="mi">μ₁ = 1.5</tspan></text>
  <text x="90" y="152" class="lbl sm" text-anchor="start">air, <tspan class="mi">μ₂ = 1</tspan></text>
  <circle cx="300" cy="300" r="4.5" class="eq0"></circle>
  <text x="288" y="316" class="lbl sm" text-anchor="end">source in the glass</text>
  <line x1="360" y1="120" x2="360" y2="240" class="dim"></line>
  <line x1="416" y1="120" x2="416" y2="240" class="dim"></line>
  <line x1="470" y1="120" x2="470" y2="240" class="dim"></line>
  <line x1="300" y1="300" x2="360" y2="170" class="ln" stroke="var(--accent)"></line>
  <line x1="360" y1="170" x2="436" y2="77" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="300" y1="300" x2="416" y2="170" class="ln" stroke="var(--accent)"></line>
  <line x1="416" y1="166" x2="556" y2="166" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="300" y1="300" x2="470" y2="170" class="ln" stroke="var(--accent)"></line>
  <line x1="470" y1="170" x2="555" y2="235" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <path d="M360,196 a26,26 0 0 0 -17,-20" class="thinl" fill="none"></path>
  <text x="352" y="216" class="mi sm" text-anchor="end">i</text>
  <path d="M416,196 a26,26 0 0 0 -21,-15" class="thinl" fill="none"></path>
  <text x="392" y="212" class="mi sm" text-anchor="end">C</text>
  <path d="M470,196 a26,26 0 0 0 -25,-7" class="thinl" fill="none"></path>
  <text x="432" y="212" class="mi sm" text-anchor="end">i</text>
  <text x="640" y="60" class="lbl sm" text-anchor="start">» <tspan class="mi">i &lt; C</tspan>: the ray refracts out, bent away from the normal</text>
  <text x="640" y="80" class="lbl sm" text-anchor="start">» <tspan class="mi">i = C = 41.8°</tspan>: the ray grazes the surface exactly</text>
  <text x="640" y="100" class="lbl sm" text-anchor="start">» <tspan class="mi">i &gt; C</tspan>: no refracted ray exists — all the light reflects</text>
  <text x="560" y="256" class="lbl sm" text-anchor="start">total internal reflection</text>
  <text x="452" y="86" class="lbl sm" text-anchor="start">refracted ray</text>
</svg>
