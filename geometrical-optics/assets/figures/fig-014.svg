<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 440" role="img" aria-label="Marginal rays of a concave mirror cross the axis closer to the mirror than the paraxial focus" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <line x1="60" y1="220" x2="820" y2="220" class="thinl"></line>
  <path d="M645.7,28 A300,300 0 0 1 645.7,412" class="ln2" fill="none"></path>
  <circle cx="400" cy="220" r="4" class="eq0"></circle><text x="400" y="248" class="lbl" text-anchor="middle">C</text>
  <circle cx="550" cy="220" r="4" class="eq0"></circle><text x="550" y="204" class="lbl" text-anchor="middle">F</text>
  <circle cx="700" cy="220" r="3.5" class="eq0"></circle><text x="714" y="240" class="lbl" text-anchor="start">P</text>
  <line x1="120" y1="190" x2="698.5" y2="190" class="ln" stroke="var(--accent)"></line>
  <line x1="698.5" y1="190" x2="300" y2="271" class="ln" stroke="var(--accent)"></line>
  <line x1="120" y1="100" x2="674.9" y2="100" class="ln" stroke="var(--accent)"></line>
  <line x1="674.9" y1="100" x2="440" y2="353" class="ln" stroke="var(--accent)"></line>
  <line x1="120" y1="400" x2="640" y2="400" class="ln" stroke="var(--accent)"></line>
  <line x1="640" y1="400" x2="561" y2="130" class="ln" stroke="var(--accent)"></line>
  <line x1="120" y1="40" x2="640" y2="40" class="ln" stroke="var(--accent)"></line>
  <line x1="640" y1="40" x2="561" y2="310" class="ln" stroke="var(--accent)"></line>
  <line x1="120" y1="250" x2="698.5" y2="250" class="ln" stroke="var(--accent)"></line>
  <line x1="698.5" y1="250" x2="300" y2="169" class="ln" stroke="var(--accent)"></line>
  <line x1="120" y1="340" x2="674.9" y2="340" class="ln" stroke="var(--accent)"></line>
  <line x1="674.9" y1="340" x2="440" y2="87" class="ln" stroke="var(--accent)"></line>
  <circle cx="550" cy="220" r="3" class="eq0"></circle>
  <circle cx="563.7" cy="220" r="3" class="eq0"></circle>
  <circle cx="587.5" cy="220" r="3" class="eq0"></circle>
  <circle cx="563.7" cy="220" r="3" class="eq0"></circle>
  <circle cx="587.5" cy="220" r="3" class="eq0"></circle>
  <text x="120" y="32" class="lbl sm" text-anchor="start">height <tspan class="mi">h = 180</tspan> px</text>
  <text x="120" y="182" class="lbl sm" text-anchor="start">height <tspan class="mi">h = 30</tspan> px (paraxial), and <tspan class="mi">h = -30</tspan> px</text>
  <text x="120" y="420" class="lbl sm" text-anchor="start">height <tspan class="mi">h = -180</tspan> px</text>
  <line x1="550" y1="220" x2="550" y2="300" class="dim"></line>
  <line x1="587.5" y1="220" x2="587.5" y2="320" class="dim"></line>
  <text x="550" y="318" class="lbl sm" text-anchor="middle">paraxial focus</text>
  <text x="600" y="338" class="lbl sm" text-anchor="middle">marginal focus</text>
  <text x="620" y="120" class="lbl sm" text-anchor="start">the crossing points spread</text>
  <text x="620" y="136" class="lbl sm" text-anchor="start">over 37 px here: that spread</text>
  <text x="620" y="152" class="lbl sm" text-anchor="start">is the caustic, and its length</text>
  <text x="620" y="168" class="lbl sm" text-anchor="start">is <tspan class="mi">h²/(4R)</tspan></text>
</svg>
