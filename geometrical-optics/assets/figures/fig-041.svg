<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="Left: the least-time path across an interface with the straight path for comparison. Right: the graph of travel time against crossing position, showing a smooth minimum where Snell&#x27;s law holds" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <rect x="70" y="150" width="360" height="150" fill="var(--accent-soft)"></rect>
  <line x1="70" y1="150" x2="430" y2="150" class="ln2"></line>
  <text x="80" y="144" class="lbl sm" text-anchor="start">fast medium, speed <tspan class="mi">v₁</tspan></text>
  <text x="80" y="172" class="lbl sm" text-anchor="start">slow medium, speed <tspan class="mi">v₂ = v₁/1.5</tspan></text>
  <circle cx="316" cy="90" r="4.5" class="eq0"></circle>
  <text x="310" y="80" class="lbl sm" text-anchor="end">A</text>
  <circle cx="507" cy="272" r="4.5" class="eq0"></circle>
  <text x="514" y="292" class="lbl sm" text-anchor="start">B</text>
  <circle cx="420" cy="150" r="4" class="eq0"></circle>
  <text x="424" y="166" class="lbl sm" text-anchor="start">X</text>
  <line x1="420" y1="96" x2="420" y2="212" class="thinl" stroke-dasharray="4 4"></line>
  <line x1="316" y1="90" x2="420" y2="150" class="ln" stroke="var(--accent)"></line>
  <line x1="420" y1="150" x2="507" y2="272" class="ln" stroke="var(--accent)"></line>
  <line x1="316" y1="90" x2="507" y2="272" class="thinl" stroke-dasharray="5 4"></line>
  <text x="392" y="196" class="lbl sm" text-anchor="end">the straight path:</text>
  <text x="392" y="212" class="lbl sm" text-anchor="end">shorter, but spends too</text>
  <text x="392" y="228" class="lbl sm" text-anchor="end">long to be the quickest</text>
  <path d="M420,112 a38,38 0 0 0 -16,24" class="thinl" fill="none"></path>
  <text x="446" y="122" class="mi sm" text-anchor="start">i</text>
  <path d="M420,182 a34,34 0 0 1 10,22" class="thinl" fill="none"></path>
  <text x="444" y="198" class="mi sm" text-anchor="start">r</text>
  <text x="240" y="322" class="lbl sm" text-anchor="middle">the actual path: <tspan class="mi">sin i / sin r = v₁/v₂ = μ</tspan></text>
  <line x1="480" y1="290" x2="836" y2="290" class="ln2" marker-end="url(#ahb)"></line>
  <line x1="480" y1="290" x2="480" y2="96" class="ln2" marker-end="url(#ahb)"></line>
  <text x="836" y="312" class="mi sm" text-anchor="end">x</text>
  <text x="466" y="100" class="mi sm" text-anchor="end">T</text>
  <polyline points="480,114 519,179 597,252 674,274 752,250 830,170" class="ln" fill="none" stroke="var(--neg)"></polyline>
  <circle cx="674" cy="274" r="4.5" class="eq0"></circle>
  <line x1="640" y1="274" x2="712" y2="274" class="thinl" stroke-dasharray="4 4"></line>
  <text x="700" y="292" class="lbl sm" text-anchor="middle">minimum</text>
  <text x="600" y="120" class="lbl sm" text-anchor="middle">T(x) for every possible crossing point</text>
  <text x="600" y="140" class="lbl sm" text-anchor="middle">the flat bottom is <tspan class="mi">dT/dx = 0</tspan>: Snell's law</text>
</svg>
