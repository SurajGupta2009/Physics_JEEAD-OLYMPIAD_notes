<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 300" role="img" aria-label="Refraction at a single spherical surface: object, image and centre of curvature" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <path d="M430,20 A230,230 0 0 1 430,280" class="ln2" fill="none"></path>
  <line x1="60" y1="150" x2="800" y2="150" class="dim"></line>
  <text x="470" y="130" class="lbl sm" text-anchor="start">medium 2, <tspan class="mi">μ₂</tspan></text>
  <text x="330" y="130" class="lbl sm" text-anchor="end">medium 1, <tspan class="mi">μ₁</tspan></text>
  <circle cx="230" cy="150" r="4.5" class="eq0"></circle><text x="230" y="176" class="lbl sm" text-anchor="middle">O</text>
  <circle cx="430" cy="150" r="4.5" class="eq0"></circle><text x="430" y="176" class="lbl sm" text-anchor="middle">P</text>
  <circle cx="664" cy="150" r="4.5" class="eq0"></circle><text x="664" y="176" class="lbl sm" text-anchor="middle">C</text>
  <circle cx="588" cy="150" r="4.5" class="eq0"></circle><text x="588" y="132" class="lbl sm" text-anchor="middle">I</text>
  <circle cx="560" cy="150" r="3" class="eq0"></circle>
  <line x1="230" y1="150" x2="430" y2="150" class="thinl" stroke-dasharray="3 3"></line>
  <line x1="430" y1="150" x2="588" y2="150" class="thinl" stroke-dasharray="3 3"></line>
  <line x1="430" y1="150" x2="664" y2="150" class="thinl" stroke-dasharray="3 3"></line>
  <line x1="230" y1="86" x2="430" y2="118" class="ln" stroke="var(--accent)"></line>
  <line x1="430" y1="118" x2="588" y2="150" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="664" y1="150" x2="430" y2="118" class="thinl"></line>
  <line x1="230" y1="60" x2="800" y2="60" class="thinl" stroke-dasharray="5 4"></line>
  <line x1="230" y1="86" x2="230" y2="150" class="dim"></line>
  <text x="212" y="110" class="mi sm" text-anchor="end">h</text>
  <text x="400" y="176" class="mi sm" text-anchor="end">u</text>
  <text x="510" y="176" class="mi sm" text-anchor="middle">v</text>
  <text x="548" y="176" class="mi sm" text-anchor="middle">R</text>
  <text x="470" y="46" class="lbl sm" text-anchor="start">the axis</text>
  <text x="620" y="106" class="lbl sm" text-anchor="start">both rays must refract to</text>
  <text x="620" y="122" class="lbl sm" text-anchor="start">the same point <tspan class="mi">I</tspan> for a sharp image</text>
  <text x="120" y="240" class="lbl sm" text-anchor="start">the image is formed where two neighbouring</text>
  <text x="120" y="256" class="lbl sm" text-anchor="start">refracted rays actually meet — here a real image, inside medium 2</text>
</svg>
