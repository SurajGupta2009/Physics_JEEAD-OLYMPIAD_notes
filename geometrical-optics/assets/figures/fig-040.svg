<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="Left: Galileo&#x27;s telescope with a diverging eyepiece. Right: a Cassegrain reflector with a convex secondary mirror and a hole in the primary" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <text x="200" y="26" class="lbl" text-anchor="middle">(a) Galileo: a diverging eyepiece inside the focus</text>
  <text x="640" y="26" class="lbl" text-anchor="middle">(b) Cassegrain: a convex secondary, a hole in the primary</text>
  <ellipse cx="140" cy="150" rx="10" ry="56" fill="var(--accent-soft)" stroke="var(--rule)"></ellipse>
  <ellipse cx="420" cy="150" rx="8" ry="34" fill="var(--panel)" stroke="var(--rule)"></ellipse>
  <line x1="30" y1="96" x2="132" y2="126" class="ln" stroke="var(--accent)"></line>
  <line x1="132" y1="126" x2="412" y2="142" class="ln" stroke="var(--accent)"></line>
  <line x1="412" y1="142" x2="700" y2="130" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="30" y1="204" x2="132" y2="174" class="ln" stroke="var(--neg)"></line>
  <line x1="132" y1="174" x2="412" y2="158" class="ln" stroke="var(--neg)"></line>
  <line x1="412" y1="158" x2="700" y2="170" class="ln" stroke="var(--neg)" marker-end="url(#ahr)"></line>
  <circle cx="560" cy="150" r="4" class="eq0"></circle>
  <text x="560" y="130" class="lbl sm" text-anchor="middle">where the focus</text>
  <text x="560" y="114" class="lbl sm" text-anchor="middle">would have been</text>
  <text x="200" y="250" class="lbl sm" text-anchor="middle">the eyepiece is reached first, while the light is</text>
  <text x="200" y="266" class="lbl sm" text-anchor="middle">still converging — so the image is erect and the tube is short</text>
  <path d="M780,58 A110,110 0 0 1 780,132" class="ln2" fill="none"></path>
  <path d="M780,168 A110,110 0 0 1 780,242" class="ln2" fill="none"></path>
  <text x="812" y="300" class="lbl sm" text-anchor="middle">primary, concave, with a hole at the centre</text>
  <path d="M700,132 A22,22 0 0 1 700,168" class="ln2" fill="none"></path>
  <text x="700" y="196" class="lbl sm" text-anchor="middle">secondary, convex</text>
  <line x1="560" y1="118" x2="770" y2="126" class="ln" stroke="var(--accent)"></line>
  <line x1="770" y1="126" x2="704" y2="140" class="ln" stroke="var(--accent)"></line>
  <line x1="704" y1="140" x2="600" y2="156" class="ln" stroke="var(--accent)"></line>
  <line x1="600" y1="156" x2="500" y2="162" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <text x="560" y="290" class="lbl sm" text-anchor="middle">light returns through the hole</text>
  <text x="560" y="306" class="lbl sm" text-anchor="middle">in the primary to the eyepiece</text>
  <text x="480" y="80" class="lbl sm" text-anchor="start">parallel light from the object enters</text>
  <text x="480" y="96" class="lbl sm" text-anchor="start">past the edge of the secondary</text>
  <text x="260" y="316" class="lbl sm" text-anchor="middle">M = <tspan class="mi">f₀</tspan>/<tspan class="mi">fₑ</tspan> in both cases — only the route to the focus differs</text>
</svg>
