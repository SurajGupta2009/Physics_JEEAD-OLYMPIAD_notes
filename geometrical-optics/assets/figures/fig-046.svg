<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="A decision tree for classifying an optics question into mirror, refraction, prism, lens, system or instrument branches" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <rect x="330" y="20" width="200" height="40" rx="8" fill="var(--accent-soft)" stroke="var(--rule)"></rect>
  <text x="430" y="45" class="lbl" text-anchor="middle">Read: what is the <tspan class="mi">element</tspan>?</text>
  <line x1="430" y1="60" x2="430" y2="82" class="ln2"></line>
  <line x1="100" y1="82" x2="760" y2="82" class="ln2"></line>
  <line x1="100" y1="82" x2="100" y2="104" class="ln2"></line>
  <line x1="240" y1="82" x2="240" y2="104" class="ln2"></line>
  <line x1="380" y1="82" x2="380" y2="104" class="ln2"></line>
  <line x1="520" y1="82" x2="520" y2="104" class="ln2"></line>
  <line x1="660" y1="82" x2="660" y2="104" class="ln2"></line>
  <line x1="760" y1="82" x2="760" y2="104" class="ln2"></line>
  <rect x="34" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="100" y="126" class="lbl sm" text-anchor="middle">plane mirror</text>
  <rect x="174" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="240" y="126" class="lbl sm" text-anchor="middle">curved mirror</text>
  <rect x="314" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="380" y="126" class="lbl sm" text-anchor="middle">plane surface / slab</text>
  <rect x="454" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="520" y="126" class="lbl sm" text-anchor="middle">prism</text>
  <rect x="594" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="660" y="126" class="lbl sm" text-anchor="middle">lens / surfaces</text>
  <rect x="694" y="104" width="132" height="34" rx="6" fill="var(--panel)" stroke="var(--rule)"></rect><text x="760" y="126" class="lbl sm" text-anchor="middle">instrument</text>
  <text x="100" y="164" class="lbl sm" text-anchor="middle">image by symmetry;</text>
  <text x="100" y="180" class="lbl sm" text-anchor="middle">2θ rule for rotation;</text>
  <text x="100" y="196" class="lbl sm" text-anchor="middle">count images by 360/θ</text>
  <text x="240" y="164" class="lbl sm" text-anchor="middle">1/v + 1/u = 1/f,</text>
  <text x="240" y="180" class="lbl sm" text-anchor="middle">f = R/2, m = −v/u;</text>
  <text x="240" y="196" class="lbl sm" text-anchor="middle">ask: real or virtual?</text>
  <text x="380" y="164" class="lbl sm" text-anchor="middle">Snell; shift t(1−1/μ);</text>
  <text x="380" y="180" class="lbl sm" text-anchor="middle">apparent depth d/μ;</text>
  <text x="380" y="196" class="lbl sm" text-anchor="middle">TIR iff denser to rarer</text>
  <text x="520" y="164" class="lbl sm" text-anchor="middle">δ = i₁+i₂−A;</text>
  <text x="520" y="180" class="lbl sm" text-anchor="middle">δmin = 2i−A, μ = sin½(A+δm)/sin½A;</text>
  <text x="520" y="196" class="lbl sm" text-anchor="middle">thin prism δ = (μ−1)A</text>
  <text x="660" y="164" class="lbl sm" text-anchor="middle">lensmaker + lens formula;</text>
  <text x="660" y="180" class="lbl sm" text-anchor="middle">powers add if in contact;</text>
  <text x="660" y="196" class="lbl sm" text-anchor="middle">silvered lens → mirror</text>
  <text x="760" y="164" class="lbl sm" text-anchor="middle">angular magnification</text>
  <text x="760" y="180" class="lbl sm" text-anchor="middle">is a ratio of angles;</text>
  <text x="760" y="196" class="lbl sm" text-anchor="middle">resolution, not M</text>
  <line x1="100" y1="210" x2="760" y2="210" class="dim"></line>
  <text x="430" y="234" class="lbl" text-anchor="middle">Then ask the two questions that decide the whole solution</text>
  <rect x="120" y="250" width="270" height="68" rx="8" fill="var(--panel)" stroke="var(--rule)"></rect>
  <text x="255" y="272" class="lbl sm" text-anchor="middle">1. Is every quantity measured</text>
  <text x="255" y="288" class="lbl sm" text-anchor="middle">from the pole / optical centre,</text>
  <text x="255" y="304" class="lbl sm" text-anchor="middle">and in which direction?</text>
  <rect x="470" y="250" width="270" height="68" rx="8" fill="var(--panel)" stroke="var(--rule)"></rect>
  <text x="605" y="272" class="lbl sm" text-anchor="middle">2. Which image does the next</text>
  <text x="605" y="288" class="lbl sm" text-anchor="middle">element see — real (it can be</text>
  <text x="605" y="304" class="lbl sm" text-anchor="middle">used) or virtual (object for it)?</text>
</svg>
