<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 268" role="img" aria-label="Three-ray construction for a converging lens: object between F and 2F, real inverted magnified image" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

    <line x1="40" y1="150" x2="820" y2="150" class="thinl"></line>
    <ellipse cx="430" cy="150" rx="16" ry="70" class="w ln"></ellipse>
    <line x1="430" y1="80" x2="430" y2="220" class="thinl"></line>
    <g class="lbl sm">
      <text x="430" y="243" text-anchor="middle">lens, focal length <tspan class="mi">f</tspan></text>
      <text x="350" y="170" text-anchor="middle" class="mi">F</text>
      <text x="270" y="170" text-anchor="middle" class="mi">2F</text>
      <text x="510" y="170" text-anchor="middle" class="mi">F</text>
      <text x="590" y="170" text-anchor="middle" class="mi">2F</text>
    </g>
    <line x1="345" y1="144" x2="355" y2="156" class="ln"></line><line x1="265" y1="144" x2="275" y2="156" class="ln"></line>
    <line x1="505" y1="144" x2="515" y2="156" class="ln"></line><line x1="585" y1="144" x2="595" y2="156" class="ln"></line>
    <line x1="310" y1="150" x2="310" y2="120" class="ln" marker-end="url(#ahg)" stroke="var(--pos)"></line>
    <text x="310" y="110" class="lbl sm" text-anchor="middle">object, height <tspan class="mi">h</tspan></text>
    <line x1="310" y1="120" x2="430" y2="120" class="ln" stroke="var(--accent)"></line>
    <line x1="430" y1="120" x2="670" y2="210" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
    <line x1="310" y1="120" x2="670" y2="210" class="thinl" marker-end="url(#ah)"></line>
    <line x1="310" y1="120" x2="350" y2="150" class="thinl" stroke-dasharray="5 4"></line>
    <line x1="350" y1="150" x2="430" y2="210" class="thinl" stroke-dasharray="5 4"></line>
    <line x1="430" y1="210" x2="670" y2="210" class="thinl" stroke-dasharray="5 4"></line>
    <line x1="670" y1="150" x2="670" y2="210" class="ln" stroke="var(--neg)" marker-end="url(#ahr)"></line>
    <text x="680" y="196" class="lbl sm" text-anchor="start">image: real, inverted, <tspan class="mi">m = v/u</tspan></text>
    <line x1="310" y1="250" x2="430" y2="250" class="dim" marker-start="url(#dim)" marker-end="url(#dim)"></line>
    <line x1="430" y1="250" x2="670" y2="250" class="dim" marker-start="url(#dim)" marker-end="url(#dim)"></line>
    <text x="370" y="264" class="mi sm" text-anchor="middle">u</text>
    <text x="550" y="264" class="mi sm" text-anchor="middle">v</text>
    <g class="lbl sm">
      <text x="118" y="60" text-anchor="start">parallel ray → through <tspan class="mi">F</tspan></text>
      <text x="118" y="76" text-anchor="start">centre ray → undeviated</text>
      <text x="118" y="92" text-anchor="start">focal ray → emerges parallel</text>
    </g>
    <rect x="80" y="46" width="250" height="56" rx="8" class="w ln" stroke-dasharray="5 4" fill="none"></rect>
</svg>
