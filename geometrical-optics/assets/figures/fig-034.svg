<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 320" role="img" aria-label="A lens whose one surface is silvered acts as an equivalent mirror; and a lens with a plane mirror behind it folds the light back" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <text x="220" y="26" class="lbl" text-anchor="middle">(a) one surface silvered: an equivalent mirror</text>
  <text x="640" y="26" class="lbl" text-anchor="middle">(b) lens + plane mirror: the light passes twice</text>
  <path d="M180,70 C215,120 215,180 180,230" fill="var(--accent-soft)" stroke="var(--rule)"></path>
  <path d="M180,70 C145,120 145,180 180,230" fill="var(--accent-soft)" stroke="var(--rule)"></path>
  <line x1="180" y1="66" x2="180" y2="234" class="ln2" stroke-dasharray="6 3"></line>
  <text x="188" y="60" class="lbl sm" text-anchor="start">silvered here</text>
  <line x1="60" y1="150" x2="180" y2="150" class="ln" stroke="var(--accent)"></line>
  <line x1="180" y1="150" x2="96" y2="150" class="ln" stroke="var(--neg)" marker-end="url(#ahr)"></line>
  <text x="60" y="140" class="lbl sm" text-anchor="start">light in</text>
  <text x="104" y="170" class="lbl sm" text-anchor="start">light back:</text>
  <text x="104" y="186" class="lbl sm" text-anchor="start">it passed the lens twice</text>
  <text x="60" y="264" class="lbl sm" text-anchor="start"><tspan class="mi">P = 2P₁ + Pₕ</tspan></text>
  <text x="60" y="282" class="lbl sm" text-anchor="start">equivalent mirror at the lens</text>
  <path d="M580,70 C615,120 615,180 580,230" fill="var(--accent-soft)" stroke="var(--rule)"></path>
  <path d="M580,70 C545,120 545,180 580,230" fill="var(--accent-soft)" stroke="var(--rule)"></path>
  <line x1="700" y1="70" x2="700" y2="230" class="ln2"></line>
  <text x="690" y="60" class="lbl sm" text-anchor="end">plane mirror</text>
  <line x1="660" y1="190" x2="696" y2="182" class="dim"></line>
  <line x1="700" y1="70" x2="700" y2="230" class="thinl" stroke-dasharray="3 3"></line>
  <line x1="480" y1="150" x2="580" y2="150" class="ln" stroke="var(--accent)"></line>
  <line x1="580" y1="150" x2="700" y2="120" class="ln" stroke="var(--accent)"></line>
  <line x1="700" y1="120" x2="580" y2="90" class="ln" stroke="var(--neg)"></line>
  <line x1="580" y1="90" x2="470" y2="120" class="ln" stroke="var(--neg)" marker-end="url(#ahr)"></line>
  <circle cx="580" cy="150" r="4" class="eq0"></circle>
  <text x="638" y="242" class="lbl sm" text-anchor="middle">the reflected beam</text>
  <text x="638" y="258" class="lbl sm" text-anchor="middle">refracts a second time,</text>
  <text x="638" y="274" class="lbl sm" text-anchor="middle">on its way out</text>
  <text x="820" y="140" class="lbl sm" text-anchor="end">mirror at</text>
  <text x="820" y="156" class="lbl sm" text-anchor="end">distance <tspan class="mi">d</tspan></text>
</svg>
