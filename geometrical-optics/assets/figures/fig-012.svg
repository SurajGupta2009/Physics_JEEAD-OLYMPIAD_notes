<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 300" role="img" aria-label="Two panels: a concave mirror with the object inside the focus giving a virtual magnified image, and a convex mirror giving a virtual diminished image" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <path d="M361.9,214.6 A220,220 0 0 1 361.9,105.4" class="ln2" fill="none"></path>
  <line x1="30" y1="160" x2="410" y2="160" class="thinl"></line>
  <circle cx="80" cy="160" r="4" class="eq0"></circle><text x="80" y="188" class="lbl sm" text-anchor="middle">C</text>
  <circle cx="190" cy="160" r="4" class="eq0"></circle><text x="190" y="188" class="lbl sm" text-anchor="middle">F</text>
  <circle cx="300" cy="160" r="3.5" class="eq0"></circle><text x="300" y="188" class="lbl sm" text-anchor="middle">P</text>
  <line x1="250" y1="160" x2="250" y2="110" class="ln" stroke="var(--pos)" marker-end="url(#ahg)"></line>
  <line x1="294.2" y1="110" x2="130" y2="172" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="250" y1="110" x2="294.2" y2="110" class="ln" stroke="var(--accent)"></line>
  <line x1="294.2" y1="110" x2="391.7" y2="68" class="thinl" stroke-dasharray="5 4"></line>
  <line x1="250" y1="110" x2="300" y2="160" class="ln" stroke="var(--accent)"></line>
  <line x1="300" y1="160" x2="250" y2="210" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="300" y1="160" x2="391.7" y2="68" class="thinl" stroke-dasharray="5 4"></line>
  <line x1="391.7" y1="160" x2="391.7" y2="68" class="ln" stroke="var(--neg)" stroke-dasharray="6 4" marker-end="url(#ahr)"></line>
  <text x="200" y="252" class="lbl sm" text-anchor="middle">(a) object inside <tspan class="mi">F</tspan>: virtual, erect, magnified</text>
  <path d="M620,60 A200,200 0 0 1 620,260" class="ln2" fill="none"></path>
  <line x1="450" y1="160" x2="850" y2="160" class="thinl"></line>
  <circle cx="620" cy="160" r="4" class="eq0"></circle><text x="620" y="188" class="lbl sm" text-anchor="middle">C</text>
  <circle cx="520" cy="160" r="4" class="eq0"></circle><text x="520" y="188" class="lbl sm" text-anchor="middle">F</text>
  <circle cx="420" cy="160" r="3.5" class="eq0"></circle><text x="420" y="188" class="lbl sm" text-anchor="middle">P</text>
  <line x1="320" y1="160" x2="320" y2="110" class="ln" stroke="var(--pos)" marker-end="url(#ahg)"></line>
  <line x1="320" y1="110" x2="426.4" y2="110" class="ln" stroke="var(--accent)"></line>
  <line x1="426.4" y1="110" x2="300" y2="177.5" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="426.4" y1="110" x2="470" y2="135" class="thinl" stroke-dasharray="5 4"></line>
  <line x1="320" y1="110" x2="420" y2="160" class="ln" stroke="var(--accent)"></line>
  <line x1="420" y1="160" x2="320" y2="210" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <line x1="420" y1="160" x2="470" y2="135" class="thinl" stroke-dasharray="5 4"></line>
  <line x1="470" y1="160" x2="470" y2="135" class="ln" stroke="var(--neg)" stroke-dasharray="6 4" marker-end="url(#ahr)"></line>
  <text x="640" y="252" class="lbl sm" text-anchor="middle">(b) convex: always virtual, erect, diminished</text>
</svg>
