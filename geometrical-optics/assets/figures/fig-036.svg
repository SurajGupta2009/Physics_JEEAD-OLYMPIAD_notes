<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="Myopia corrected by a concave lens and hypermetropia corrected by a convex lens" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <text x="200" y="26" class="lbl" text-anchor="middle">(a) myopia: image falls short, corrected by a concave lens</text>
  <text x="640" y="26" class="lbl" text-anchor="middle">(b) hypermetropia: image falls beyond, corrected by a convex lens</text>
  <ellipse cx="230" cy="140" rx="86" ry="72" fill="var(--accent-soft)" stroke="var(--rule)"></ellipse>
  <path d="M330,80 A86,72 0 0 0 330,200" class="ln2" fill="none"></path>
  <ellipse cx="170" cy="140" rx="8" ry="26" fill="var(--panel)" stroke="var(--rule)"></ellipse>
  <ellipse cx="80" cy="140" rx="7" ry="34" fill="var(--panel)" stroke="var(--rule)"></ellipse>
  <line x1="20" y1="112" x2="72" y2="140" class="ln" stroke="var(--accent)"></line>
  <line x1="20" y1="168" x2="72" y2="140" class="ln" stroke="var(--accent)"></line>
  <line x1="88" y1="140" x2="280" y2="140" class="ln" stroke="var(--accent)"></line>
  <circle cx="296" cy="140" r="4" class="eq0"></circle>
  <text x="300" y="134" class="lbl sm" text-anchor="start">focus</text>
  <text x="300" y="150" class="lbl sm" text-anchor="start">in front of</text>
  <text x="300" y="166" class="lbl sm" text-anchor="start">the retina</text>
  <text x="52" y="230" class="lbl sm" text-anchor="middle">concave</text>
  <text x="52" y="246" class="lbl sm" text-anchor="middle">correction</text>
  <text x="20" y="104" class="lbl sm" text-anchor="start">parallel rays from</text>
  <text x="20" y="88" class="lbl sm" text-anchor="start">a distant object</text>
  <ellipse cx="660" cy="140" rx="86" ry="72" fill="var(--accent-soft)" stroke="var(--rule)"></ellipse>
  <path d="M760,80 A86,72 0 0 0 760,200" class="ln2" fill="none"></path>
  <ellipse cx="600" cy="140" rx="8" ry="26" fill="var(--panel)" stroke="var(--rule)"></ellipse>
  <ellipse cx="510" cy="140" rx="7" ry="34" fill="var(--panel)" stroke="var(--rule)"></ellipse>
  <line x1="440" y1="120" x2="502" y2="132" class="ln" stroke="var(--accent)"></line>
  <line x1="440" y1="160" x2="502" y2="148" class="ln" stroke="var(--accent)"></line>
  <line x1="518" y1="132" x2="660" y2="140" class="ln" stroke="var(--accent)"></line>
  <line x1="518" y1="148" x2="660" y2="140" class="ln" stroke="var(--accent)"></line>
  <line x1="660" y1="140" x2="790" y2="140" class="thinl" stroke-dasharray="4 4"></line>
  <circle cx="800" cy="140" r="4" class="eq0"></circle>
  <text x="792" y="126" class="lbl sm" text-anchor="end">the focus would</text>
  <text x="792" y="110" class="lbl sm" text-anchor="end">land beyond the retina</text>
  <text x="490" y="230" class="lbl sm" text-anchor="middle">convex</text>
  <text x="490" y="246" class="lbl sm" text-anchor="middle">correction</text>
  <text x="440" y="200" class="lbl sm" text-anchor="start">diverging rays from a near object,</text>
  <text x="440" y="216" class="lbl sm" text-anchor="start">now too weak to converge in time</text>
  <text x="200" y="300" class="lbl" text-anchor="middle">myopia = too much power (or too long an eyeball)</text>
  <text x="640" y="300" class="lbl" text-anchor="middle">hypermetropia = too little power (or too short an eyeball)</text>
  <text x="420" y="326" class="lbl sm" text-anchor="middle">in both panels the corrective lens is drawn in front of the eye, and in both cases its job is to make the rays arrive at the eye's own lens with the vergence that lens expects</text>
</svg>
