<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 340" role="img" aria-label="Ray paths through two water drops: one internal reflection giving the primary bow, two giving the secondary bow, with the emergent directions marked" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <circle cx="230" cy="180" r="90" fill="none" stroke="var(--rule)" class="ln2"></circle>
  <circle cx="620" cy="180" r="90" fill="none" stroke="var(--rule)" class="ln2"></circle>
  <line x1="100" y1="102" x2="184" y2="102" class="ln" stroke="var(--accent)"></line>
  <line x1="184" y1="102" x2="314" y2="148" class="ln" stroke="var(--accent)"></line>
  <line x1="314" y1="148" x2="248" y2="268" class="ln" stroke="var(--accent)"></line>
  <line x1="248" y1="268" x2="202" y2="310" class="ln" stroke="var(--accent)" marker-end="url(#ahb)"></line>
  <circle cx="184" cy="102" r="3.5" class="eq0"></circle><circle cx="314" cy="148" r="3.5" class="eq0"></circle><circle cx="248" cy="268" r="3.5" class="eq0"></circle>
  <line x1="184" y1="102" x2="420" y2="102" class="thinl" stroke-dasharray="5 4"></line>
  <text x="300" y="86" class="lbl sm" text-anchor="middle">sunlight, parallel rays</text>
  <text x="230" y="300" class="lbl sm" text-anchor="middle">one internal reflection</text>
  <text x="120" y="326" class="lbl sm" text-anchor="start">primary bow: the emergent ray leaves 42° from the line back to the sun</text>
  <line x1="450" y1="94" x2="592" y2="94" class="ln" stroke="var(--neg)"></line>
  <line x1="592" y1="94" x2="705" y2="151" class="ln" stroke="var(--neg)"></line>
  <line x1="705" y1="151" x2="651" y2="265" class="ln" stroke="var(--neg)"></line>
  <line x1="651" y1="265" x2="536" y2="212" class="ln" stroke="var(--neg)"></line>
  <line x1="536" y1="212" x2="497" y2="164" class="ln" stroke="var(--neg)" marker-end="url(#ahr)"></line>
  <circle cx="592" cy="94" r="3.5" class="eq0"></circle><circle cx="705" cy="151" r="3.5" class="eq0"></circle><circle cx="651" cy="265" r="3.5" class="eq0"></circle><circle cx="536" cy="212" r="3.5" class="eq0"></circle>
  <line x1="592" y1="94" x2="820" y2="94" class="thinl" stroke-dasharray="5 4"></line>
  <text x="620" y="300" class="lbl sm" text-anchor="middle">two internal reflections</text>
  <text x="440" y="326" class="lbl sm" text-anchor="start">secondary bow: 51° from the same line, with the colour order reversed</text>
  <text x="430" y="40" class="lbl sm" text-anchor="middle">Each drop is a refract-reflect-refract machine: only the rays near the extreme deviation survive in enough numbers to be seen.</text>
</svg>
