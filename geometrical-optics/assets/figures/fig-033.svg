<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 320" role="img" aria-label="Left: the v versus u hyperbola for a lens. Right: the straight line of 1/v against 1/u whose intercepts give the focal length" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <text x="230" y="26" class="lbl" text-anchor="middle">(a) the hyperbola: <tspan class="mi">v</tspan> against <tspan class="mi">|u|</tspan></text>
  <text x="640" y="26" class="lbl" text-anchor="middle">(b) the straight line: <tspan class="mi">1/v</tspan> against <tspan class="mi">1/u</tspan></text>
  <line x1="120" y1="290" x2="420" y2="290" class="ln" marker-end="url(#ah)"></line>
  <line x1="120" y1="290" x2="120" y2="45" class="ln" marker-end="url(#ah)"></line>
  <text x="410" y="312" class="mi sm" text-anchor="end">|u|</text>
  <text x="132" y="52" class="mi sm" text-anchor="start">v</text>
  <line x1="120" y1="60" x2="420" y2="60" class="thinl" stroke-dasharray="4 4"></line>
  <text x="112" y="64" class="mi sm" text-anchor="end">120</text>
  <line x1="120" y1="290" x2="420" y2="290" class="thinl"></line>
  <text x="112" y="294" class="mi sm" text-anchor="end">24</text>
  <line x1="120" y1="290" x2="120" y2="45" class="thinl" stroke-dasharray="4 4"></line>
  <text x="120" y="312" class="mi sm" text-anchor="middle">24</text>
  <polyline points="138.3,60 156.7,175 193.3,232.5 230,251.7 413.3,275.6" class="ln" stroke="var(--accent)" fill="none"></polyline>
  <line x1="120" y1="290" x2="413.3" y2="60" class="thinl" stroke-dasharray="6 4"></line>
  <text x="300" y="140" class="lbl sm" text-anchor="middle">the straight line <tspan class="mi">v = |u|</tspan> (same-size image)</text>
  <circle cx="193.3" cy="232.5" r="4.5" class="eq0"></circle>
  <text x="200" y="248" class="lbl sm" text-anchor="start">crossing at <tspan class="mi">|u| = 2f</tspan></text>
  <text x="250" y="86" class="lbl sm" text-anchor="middle">as <tspan class="mi">|u| → f</tspan>, <tspan class="mi">v → ∞</tspan></text>
  <text x="250" y="286" class="lbl sm" text-anchor="middle">as <tspan class="mi">|u| → ∞</tspan>, <tspan class="mi">v → f</tspan></text>
  <line x1="500" y1="170" x2="820" y2="170" class="ln" marker-end="url(#ah)"></line>
  <line x1="660" y1="290" x2="660" y2="60" class="ln" marker-end="url(#ah)"></line>
  <text x="812" y="194" class="mi sm" text-anchor="end">1/u</text>
  <text x="672" y="68" class="mi sm" text-anchor="start">1/v</text>
  <line x1="660" y1="170" x2="800" y2="130" class="ln" stroke="var(--accent)"></line>
  <line x1="660" y1="170" x2="520" y2="210" class="ln" stroke="var(--accent)"></line>
  <circle cx="800" cy="130" r="4" class="eq0"></circle>
  <circle cx="520" cy="210" r="4" class="eq0"></circle>
  <text x="806" y="126" class="lbl sm" text-anchor="start">intercept <tspan class="mi">1/f</tspan> on the <tspan class="mi">1/v</tspan> axis</text>
  <text x="514" y="226" class="lbl sm" text-anchor="end">intercept <tspan class="mi">-1/f</tspan> on the <tspan class="mi">1/u</tspan> axis</text>
  <text x="660" y="304" class="lbl sm" text-anchor="middle">slope exactly 1 — the mark of a lens obeying (6.4)</text>
</svg>
