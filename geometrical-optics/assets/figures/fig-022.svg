<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 330" role="img" aria-label="Delta versus i for glass to air: refraction branch rising to the critical angle, a jump, then the reflected branch falling back to zero" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <line x1="120" y1="280" x2="800" y2="280" class="ln" marker-end="url(#ah)"></line>
  <line x1="120" y1="280" x2="120" y2="45" class="ln" marker-end="url(#ah)"></line>
  <text x="790" y="304" class="mi sm" text-anchor="end">i</text>
  <text x="132" y="52" class="mi sm" text-anchor="start">δ</text>
  <line x1="120" y1="222.5" x2="128" y2="222.5" class="thinl"></line><text x="112" y="227" class="mi sm" text-anchor="end">45</text>
  <line x1="120" y1="165" x2="128" y2="165" class="thinl"></line><text x="112" y="170" class="mi sm" text-anchor="end">90</text>
  <line x1="120" y1="107.5" x2="128" y2="107.5" class="thinl"></line><text x="112" y="112" class="mi sm" text-anchor="end">135</text>
  <line x1="120" y1="50" x2="128" y2="50" class="thinl"></line><text x="112" y="55" class="mi sm" text-anchor="end">180</text>
  <line x1="340" y1="280" x2="340" y2="272" class="thinl"></line><text x="340" y="298" class="mi sm" text-anchor="middle">30</text>
  <line x1="560" y1="280" x2="560" y2="272" class="thinl"></line><text x="560" y="298" class="mi sm" text-anchor="middle">60</text>
  <line x1="780" y1="280" x2="780" y2="272" class="thinl"></line><text x="780" y="298" class="mi sm" text-anchor="middle">90</text>
  <polyline points="120,280 193,273.5 267,266 340,256 427,218" class="ln" stroke="var(--accent)" fill="none"></polyline>
  <line x1="427" y1="218" x2="427" y2="127" class="thinl" stroke-dasharray="5 4"></line>
  <polyline points="427,127 487,178 560,203 633,229 707,254 780,280" class="ln" stroke="var(--accent)" fill="none"></polyline>
  <circle cx="427" cy="218" r="4" class="eq0"></circle>
  <circle cx="427" cy="127" r="4" class="eq0"></circle>
  <text x="440" y="214" class="lbl sm" text-anchor="start">δ = 90° − C = 48.2° at <tspan class="mi">i = C</tspan></text>
  <text x="440" y="120" class="lbl sm" text-anchor="start">the jump: <tspan class="mi">δ</tspan> becomes 180° − 2C = 96.4°</text>
  <text x="250" y="240" class="lbl sm" text-anchor="middle">refraction: <tspan class="mi">δ = r − i</tspan></text>
  <text x="250" y="258" class="lbl sm" text-anchor="middle">(glass → air)</text>
  <text x="660" y="196" class="lbl sm" text-anchor="middle">reflection: <tspan class="mi">δ = 180° − 2i</tspan></text>
  <text x="700" y="130" class="lbl sm" text-anchor="middle">a mirror's law,</text>
  <text x="700" y="148" class="lbl sm" text-anchor="middle">for <tspan class="mi">i &gt; C</tspan></text>
</svg>
