<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 232" role="img" aria-label="MEMS pull-in: a plate on a spring with the energy curves showing two minima merging into one inflection at one third of the gap; and a charged droplet with its Rayleigh limit plus the Taylor cone at 49.3 degrees" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g transform="translate(34,26)">
    <text x="0" y="-8" class="lbl md" font-weight="700">The fold: two equilibria, then none</text>
    <rect x="0" y="8" width="120" height="10" stroke="var(--fg)" stroke-width="2" fill="none"></rect>
    <text x="130" y="20" class="lbl sm">fixed electrode</text>
    <path d="M20,18 l0,14 M20,32 q10,8 20,0 q10,-8 20,0 q10,8 20,0 q10,-8 20,0 q10,8 20,0" class="thinl"></path>
    <rect x="14" y="44" width="76" height="10" stroke="var(--accent)" stroke-width="2.4" fill="var(--accent-soft)"></rect>
    <text x="130" y="56" class="lbl sm">plate at x, spring k</text>
    <line x1="0" y1="70" x2="120" y2="70" class="dim"></line><line x1="0" y1="62" x2="0" y2="78" class="thinl"></line><line x1="120" y1="62" x2="120" y2="78" class="thinl"></line>
    <text x="34" y="90" class="mi sm">ℓ₀</text>
    <path d="M96,8 V62" class="acc" stroke-dasharray="5 4"></path>
    <text x="98" y="110" class="lbl sm" fill="var(--accent)">x = ℓ₀/3 at</text>
    <text x="98" y="126" class="lbl sm" fill="var(--accent)">V² = 8kℓ₀³/27ε₀A</text>
    <g transform="translate(0,132)">
      <line x1="0" y1="60" x2="200" y2="60" class="ln"></line><line x1="0" y1="0" x2="0" y2="60" class="ln"></line>
      <text x="150" y="76" class="lbl sm">x/ℓ₀ →</text><text x="-4" y="-6" class="lbl sm" text-anchor="end">Π</text>
      <path d="M4,20 C18,52 30,54 44,40 C58,26 70,10 84,-4" fill="none" stroke="var(--muted)" stroke-width="1.8"></path>
      <path d="M4,26 C22,58 40,58 60,44 C70,38 76,34 84,26" fill="none" stroke="var(--fg)" stroke-width="1.8"></path>
      <path d="M4,34 C30,58 60,52 84,30" fill="none" stroke="var(--accent)" stroke-width="2.4"></path>
      <circle cx="34" cy="50" r="4" fill="var(--pos)"></circle><circle cx="66" cy="44" r="4" fill="var(--neg)"></circle>
      <circle cx="50" cy="53" r="4" fill="var(--amber)"></circle>
      <text x="92" y="34" class="lbl sm">below V_pi: a stable well (•) and a barrier (×)</text>
      <text x="92" y="50" class="lbl sm">at V_pi: the inflection — the well and the</text>
      <text x="92" y="66" class="lbl sm">barrier merge, and everything falls in</text>
    </g>
  </g>
  <g transform="translate(404,26)">
    <text x="0" y="-8" class="lbl md" font-weight="700">The same fold in a drop of liquid</text>
    <circle cx="60" cy="56" r="34" stroke="var(--fg)" stroke-width="2" fill="var(--surface)"></circle>
    <g class="fp"><circle cx="60" cy="26" r="2.6"></circle><circle cx="86" cy="42" r="2.6"></circle><circle cx="34" cy="42" r="2.6"></circle><circle cx="86" cy="72" r="2.6"></circle><circle cx="34" cy="72" r="2.6"></circle></g>
    <path d="M60,10 V2 M96,24 l10,-8 M24,24 l-10,-8" class="facc"></path>
    <text x="108" y="40" class="lbl sm">U(R) = Q²/8πε₀R + 4πγR²</text>
    <text x="108" y="58" class="lbl sm">dU/dR = 0 ⇒ Q² = 64π²ε₀γR³</text>
    <text x="108" y="76" class="lbl sm">the minimum in R vanishes —</text>
    <text x="108" y="92" class="lbl sm">not a force balance</text>
    <g transform="translate(6,112)">
      <path d="M54,0 V26" class="ln"></path>
      <path d="M54,26 L18,96 M54,26 L90,96" stroke="var(--accent)" stroke-width="2.4" fill="none"></path>
      <path d="M18,96 H90" class="ln"></path>
      <path d="M54,26 V96" class="ln2" stroke="var(--muted)" stroke-dasharray="4 4"></path>
      <path d="M54,60 A34,34 0 0 1 40,55" class="eq0"></path>
      <text x="4" y="64" class="lbl sm">49.3°</text>
      <text x="98" y="60" class="lbl sm">P_{1/2}(cos θ) = 0: the cone at which</text>
      <text x="98" y="76" class="lbl sm">E ∝ r^{−1/2} exactly, so the apex can</text>
      <text x="98" y="92" class="lbl sm">emit without the singularity diverging.</text>
    </g>
  </g>
</svg>
