<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 230" role="img" aria-label="Parallel plate capacitor: charge on inner faces, Gaussian box, and the field profile" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g><rect x="60" y="40" width="250" height="16" class="fp"></rect><rect x="60" y="150" width="250" height="16" class="fn"></rect>
    <g fill="var(--pos)" font-size="13"><text x="80" y="53">+</text><text x="115" y="53">+</text><text x="150" y="53">+</text><text x="185" y="53">+</text><text x="220" y="53">+</text><text x="255" y="53">+</text><text x="290" y="53">+</text></g>
    <g fill="var(--neg)" font-size="13"><text x="80" y="163">−</text><text x="115" y="163">−</text><text x="150" y="163">−</text><text x="185" y="163">−</text><text x="220" y="163">−</text><text x="255" y="163">−</text><text x="290" y="163">−</text></g>
    <text x="185" y="32" class="lbl sm" text-anchor="middle">all of +Q on the inner face; the outer face carries nothing</text>
    <g stroke="var(--accent)" stroke-width="1.6" fill="none"><line x1="90" y1="62" x2="90" y2="144" marker-end="url(#ahb)"></line><line x1="140" y1="62" x2="140" y2="144" marker-end="url(#ahb)"></line><line x1="190" y1="62" x2="190" y2="144" marker-end="url(#ahb)"></line><line x1="240" y1="62" x2="240" y2="144" marker-end="url(#ahb)"></line><line x1="290" y1="62" x2="290" y2="144" marker-end="url(#ahb)"></line></g>
    <rect x="150" y="70" width="80" height="96" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="6 3"></rect>
    <text x="190" y="122" class="lbl sm" text-anchor="middle">Gaussian box:</text>
    <text x="190" y="136" class="lbl sm" text-anchor="middle">one face in each metal</text>
  </g>
  <g transform="translate(380,20)">
    <line x1="30" y1="150" x2="292" y2="150" class="ln"></line><line x1="30" y1="150" x2="30" y2="16" class="ln"></line>
    <text x="296" y="164" class="lbl sm">x</text><text x="12" y="24" class="lbl sm">E</text>
    <path d="M30,150 H92 M92,150 V50 H208 V150 M208,150 H288" class="ln2" fill="none" stroke="var(--accent)" marker-end="url(#ahb)"></path>
    <line x1="92" y1="150" x2="92" y2="46" class="thinl"></line><line x1="208" y1="150" x2="208" y2="46" class="thinl"></line>
    <text x="150" y="40" class="mi sm" text-anchor="middle">σ/ε₀ = V/d</text>
    <text x="60" y="166" class="lbl sm" text-anchor="middle">metal</text><text x="150" y="166" class="lbl sm" text-anchor="middle">gap</text><text x="248" y="166" class="lbl sm" text-anchor="middle">metal</text>
    <line x1="92" y1="126" x2="208" y2="126" class="ln" marker-start="url(#dim)" marker-end="url(#dim)"></line><text x="150" y="122" class="mi sm" text-anchor="middle">d</text>
    <text x="150" y="198" class="lbl sm" text-anchor="middle">V = area under this step = E·d</text>
  </g>
</svg>
