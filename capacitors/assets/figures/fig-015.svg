<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 250" role="img" aria-label="A slab of dielectric between capacitor plates: dipoles drawn as displaced charge pairs, bound surface charge opposing the free plate charge" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g transform="translate(40,20)">
    <rect x="0" y="10" width="14" height="180" class="w" stroke="var(--fg)" stroke-width="2"></rect>
    <rect x="316" y="10" width="14" height="180" class="w" stroke="var(--fg)" stroke-width="2"></rect>
    <text x="-16" y="105" class="mi" transform="rotate(-90,-16,105)">+ plate, σ_f</text>
    <text x="352" y="105" class="mi" transform="rotate(90,352,105)">− plate, −σ_f</text>
    <rect x="60" y="22" width="210" height="156" class="fp"></rect>
    <text x="118" y="16" class="lbl sm">dielectric, κ</text>
    <g>
      <circle cx="90" cy="60" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="86" y="64" class="mtext">−</text>
      <circle cx="118" cy="60" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="115" y="64" class="mtext">+</text>
      <line x1="100" y1="60" x2="111" y2="60" class="thinl"></line>
      <circle cx="160" cy="60" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="156" y="64" class="mtext">−</text>
      <circle cx="188" cy="60" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="185" y="64" class="mtext">+</text>
      <line x1="170" y1="60" x2="181" y2="60" class="thinl"></line>
      <circle cx="230" cy="60" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="226" y="64" class="mtext">−</text>
      <circle cx="258" cy="60" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="255" y="64" class="mtext">+</text>
      <line x1="240" y1="60" x2="251" y2="60" class="thinl"></line>
      <circle cx="90" cy="120" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="86" y="124" class="mtext">−</text>
      <circle cx="118" cy="120" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="115" y="124" class="mtext">+</text>
      <line x1="100" y1="120" x2="111" y2="120" class="thinl"></line>
      <circle cx="160" cy="120" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="156" y="124" class="mtext">−</text>
      <circle cx="188" cy="120" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="185" y="124" class="mtext">+</text>
      <line x1="170" y1="120" x2="181" y2="120" class="thinl"></line>
      <circle cx="230" cy="120" r="9" fill="var(--neg)" opacity=".22" stroke="var(--neg)"></circle><text x="226" y="124" class="mtext">−</text>
      <circle cx="258" cy="120" r="6" fill="var(--pos)" opacity=".3" stroke="var(--pos)"></circle><text x="255" y="124" class="mtext">+</text>
      <line x1="240" y1="120" x2="251" y2="120" class="thinl"></line>
    </g>
    <line x1="56" y1="40" x2="56" y2="160" stroke="var(--neg)" stroke-width="2.2"></line>
    <text x="30" y="200" class="lbl sm" fill="var(--neg)">−σ_b</text>
    <line x1="274" y1="40" x2="274" y2="160" stroke="var(--pos)" stroke-width="2.2"></line>
    <text x="256" y="200" class="lbl sm" fill="var(--pos)">+σ_b</text>
    <g stroke="var(--accent)" stroke-width="1.6">
      <line x1="20" y1="100" x2="52" y2="100" marker-end="url(#ahb)"></line>
      <line x1="120" y1="100" x2="152" y2="100" marker-end="url(#ahb)"></line>
      <line x1="220" y1="100" x2="252" y2="100" marker-end="url(#ahb)"></line>
      <line x1="280" y1="100" x2="312" y2="100" marker-end="url(#ahb)"></line>
    </g>
    <text x="120" y="90" class="mi sm">E = E₀ − σ_b/ε₀  &lt;  E₀</text>
    <text x="60" y="222" class="lbl">Each dipole is stretched <tspan font-style="italic">with</tspan> the field; the sheet of bound charge it leaves on each face makes a field <tspan font-style="italic">against</tspan> it.</text>
  </g>
</svg>
