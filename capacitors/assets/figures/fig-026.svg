<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 214" role="img" aria-label="Neon lamp relaxation oscillator circuit and the sawtooth-like capacitor voltage swinging between the extinguishing and striking levels" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g transform="translate(30,26)">
    <path d="M0,20 H60 M0,120 H230 M0,20 V120" class="ln"></path>
    <text x="-30" y="24" class="lbl sm">V_s</text>
    <rect x="60" y="12" width="46" height="16" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="70" y="10" class="mi sm">R</text>
    <path d="M106,20 H200 M200,20 V60" class="ln"></path>
    <path d="M200,120 H160 M120,120 H0" class="ln"></path>
    <path d="M160,120 V96 M200,120 V96" class="ln"></path>
    <path d="M166,72 V96 M194,72 V96" stroke="var(--fg)" stroke-width="2"></path>
    <line x1="162" y1="78" x2="198" y2="92" stroke="var(--amber)" stroke-width="1.6"></line>
    <line x1="162" y1="92" x2="198" y2="78" stroke="var(--amber)" stroke-width="1.6"></line>
    <text x="128" y="66" class="lbl sm">neon: strikes at V_hi,</text>
    <text x="128" y="80" class="lbl sm">holds above V_lo</text>
    <path d="M200,60 V72 M160,60 V72 M160,60 H200" class="ln"></path>
    <path d="M170,52 V68 M190,52 V68" stroke="var(--fg)" stroke-width="2"></path>
    <text x="206" y="60" class="mi sm">C</text>
    <path d="M160,60 H120 M120,60 V120 M120,20 V60" class="ln"></path>
    <text x="0" y="156" class="lbl sm">While the lamp is off, C charges toward V_s with τ = RC. When it strikes, C dumps into</text>
    <text x="0" y="172" class="lbl sm">the lamp until the current falls below the holding value, and the cycle restarts.</text>
  </g>
  <g transform="translate(380,26)">
    <line x1="0" y1="120" x2="300" y2="120" class="ln"></line><line x1="0" y1="0" x2="0" y2="120" class="ln"></line>
    <line x1="0" y1="30" x2="300" y2="30" class="thinl"></line><text x="282" y="26" class="lbl sm">V_hi</text>
    <line x1="0" y1="90" x2="300" y2="90" class="thinl"></line><text x="282" y="86" class="lbl sm">V_lo</text>
    <line x1="0" y1="8" x2="300" y2="8" class="thinl" stroke-dasharray="4 4"></line><text x="252" y="4" class="lbl sm">V_s</text>
    <path d="M0,120 C40,80 60,44 70,30 L74,90 C110,50 130,38 145,30 L150,90 C186,52 206,40 221,30 L226,90 C262,52 282,40 297,30" fill="none" stroke="var(--accent)" stroke-width="2.6"></path>
    <text x="76" y="112" class="lbl sm">fast decay, τ′ = (r‖R)C</text>
    <text x="8" y="146" class="lbl sm">V_C(t)</text>
    <text x="0" y="170" class="lbl sm">T = RC ln[(V_s−V_lo)/(V_s−V_hi)] — and it diverges as V_s approaches V_hi,</text>
    <text x="0" y="186" class="lbl sm">because the exponential only reaches the strike level in infinite time.</text>
  </g>
</svg>
