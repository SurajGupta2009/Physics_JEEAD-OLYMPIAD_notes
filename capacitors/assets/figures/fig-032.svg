<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 300" role="img" aria-label="Flowchart: is the configuration asked for? yes then is the medium homogeneous, if yes use Gauss and if no use the matrix or a map; if not then is the circuit a single capacitor with resistors, if yes use the three numbers, if no use charge conservation on the island" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <defs></defs>
  <g font-size="13">
    <rect x="250" y="6" width="220" height="40" rx="6" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="360" y="24" class="lbl sm" text-anchor="middle" font-weight="700">What is being asked?</text>
    <text x="360" y="39" class="lbl sm" text-anchor="middle" fill="var(--muted)">C? force? field? V(t)? heat?</text>
    <path d="M250,26 H150 V70" class="ln2"></path><path d="M470,26 H570 V70" class="ln2"></path>
    <text x="182" y="62" class="lbl sm">a configuration</text>
    <text x="498" y="62" class="lbl sm">in time</text>
    <rect x="40" y="70" width="220" height="46" rx="6" class="w" stroke="var(--accent)" stroke-width="1.8"></rect>
    <text x="150" y="90" class="lbl sm" text-anchor="middle" font-weight="700">Is the medium homogeneous</text>
    <text x="150" y="106" class="lbl sm" text-anchor="middle">and the symmetry plane /</text>
    <text x="150" y="120" class="lbl sm" text-anchor="middle">cylinder / sphere?</text>
    <rect x="460" y="70" width="220" height="46" rx="6" class="w" stroke="var(--accent)" stroke-width="1.8"></rect>
    <text x="570" y="90" class="lbl sm" text-anchor="middle" font-weight="700">Exactly one capacitor</text>
    <text x="570" y="106" class="lbl sm" text-anchor="middle">or one island of capacitors?</text>
    <path d="M150,124 V150 H60 V170" class="ln2"></path><path d="M150,124 V170" class="ln2" marker-end="url(#ah)"></path>
    <path d="M610,124 V150 H700 V170" class="ln2"></path><path d="M570,124 V170" class="ln2" marker-end="url(#ah)"></path>
    <text x="106" y="146" class="lbl sm">yes</text><text x="598" y="146" class="lbl sm">yes</text>
    <rect x="8" y="176" width="150" height="52" rx="6" class="w" stroke="var(--pos)" stroke-width="1.8"></rect>
    <text x="83" y="196" class="lbl sm" text-anchor="middle" font-weight="700">Gauss</text>
    <text x="83" y="212" class="lbl sm" text-anchor="middle">E=σ/ε₀, then V=Ed,</text>
    <text x="83" y="224" class="lbl sm" text-anchor="middle">then C=Q/V</text>
    <rect x="172" y="176" width="160" height="52" rx="6" class="w" stroke="var(--violet)" stroke-width="1.8"></rect>
    <text x="252" y="196" class="lbl sm" text-anchor="middle" font-weight="700">Move 3: the matrix</text>
    <text x="252" y="212" class="lbl sm" text-anchor="middle">Δ–Y, fold, images, spheroid,</text>
    <text x="252" y="224" class="lbl sm" text-anchor="middle">conformal map (§7)</text>
    <rect x="470" y="176" width="150" height="52" rx="6" class="w" stroke="var(--pos)" stroke-width="1.8"></rect>
    <text x="545" y="196" class="lbl sm" text-anchor="middle" font-weight="700">Three numbers + τ</text>
    <text x="545" y="212" class="lbl sm" text-anchor="middle">V(0), V(∞), R_th C.</text>
    <text x="545" y="224" class="lbl sm" text-anchor="middle">Move 7.</text>
    <rect x="632" y="176" width="82" height="52" rx="6" class="w" stroke="var(--violet)" stroke-width="1.8"></rect>
    <text x="673" y="196" class="lbl sm" text-anchor="middle" font-weight="700">Move 8</text>
    <text x="673" y="212" class="lbl sm" text-anchor="middle">island</text>
    <text x="673" y="224" class="lbl sm" text-anchor="middle">charge</text>
    <path d="M332,202 H470" class="ln2" stroke="var(--muted)" stroke-dasharray="5 4" marker-end="url(#ah)"></path>
    <text x="342" y="194" class="lbl sm" fill="var(--muted)">mixed? both branches are allowed at once</text>
    <rect x="150" y="252" width="420" height="38" rx="6" class="w" stroke="var(--amber)" stroke-width="1.8"></rect>
    <text x="360" y="268" class="lbl sm" text-anchor="middle" font-weight="700">Before writing anything: is Q or V held fixed?</text>
    <text x="360" y="282" class="lbl sm" text-anchor="middle" fill="var(--muted)">energy and force change sign with the answer (§8.2, move 5)</text>
  </g>
</svg>
