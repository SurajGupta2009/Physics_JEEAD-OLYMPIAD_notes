<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 230" role="img" aria-label="Left: a DC network with capacitors and resistors as drawn. Right: the same network in steady state with the capacitor branch deleted and only the resistor loop carrying current" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g transform="translate(24,26)">
    <text x="0" y="-6" class="lbl md" font-weight="700">As drawn</text>
    <path d="M0,30 H70 M0,150 H70" class="ln"></path>
    <circle cx="86" cy="30" r="4" fill="var(--fg)"></circle><circle cx="86" cy="150" r="4" fill="var(--fg)"></circle>
    <path d="M86,30 V66 M86,110 V150" class="ln"></path>
    <rect x="78" y="66" width="16" height="44" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="102" y="92" class="mi sm">R₁</text>
    <path d="M86,30 H170 M86,150 H170" class="ln"></path>
    <circle cx="186" cy="30" r="4" fill="var(--fg)"></circle><circle cx="186" cy="150" r="4" fill="var(--fg)"></circle>
    <path d="M186,30 V52 M186,78 V96 M186,110 V150" class="ln"></path>
    <path d="M172,78 h28 M172,96 h28" stroke="var(--fg)" stroke-width="2"></path>
    <text x="200" y="92" class="mi sm">C₁</text>
    <path d="M186,96 H260 M186,30 H300" class="ln"></path>
    <circle cx="276" cy="96" r="4" fill="var(--fg)"></circle>
    <path d="M276,96 V120" class="ln"></path>
    <rect x="268" y="120" width="16" height="30" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="292" y="140" class="mi sm">R₃</text>
    <path d="M276,150 H186" class="ln"></path>
    <path d="M300,30 V66 M300,110 V150 M300,150 H276" class="ln"></path>
    <rect x="292" y="66" width="16" height="44" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="316" y="92" class="mi sm">R₂</text>
    <path d="M300,30 H340 M300,150 H340" class="ln"></path>
    <path d="M340,22 v16 M352,28 h-24 M340,142 v16 M352,148 h-24" stroke="var(--fg)" stroke-width="1.8"></path>
    <text x="360" y="92" class="lbl sm">V</text>
    <text x="0" y="184" class="lbl sm">C₁ sits between the R₁–R₂ node and the lower rail; R₃ dangles into C₁'s node from R₂.</text>
  </g>
  <g transform="translate(430,26)">
    <text x="0" y="-6" class="lbl md" font-weight="700">Step 1: delete every capacitor branch</text>
    <path d="M0,30 H70 M0,150 H70 M86,30 V150 M86,30 H170 M86,150 H170" class="ln"></path>
    <rect x="78" y="66" width="16" height="44" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="102" y="92" class="mi sm">R₁</text>
    <path d="M186,30 V150" class="ln2" stroke="var(--muted)" stroke-dasharray="4 4"></path>
    <text x="176" y="92" class="lbl sm" fill="var(--muted)">open</text>
    <path d="M240,30 V150 M240,30 H300 M240,150 H300" class="ln"></path>
    <rect x="232" y="66" width="16" height="44" class="w" stroke="var(--fg)" stroke-width="1.8"></rect>
    <text x="256" y="92" class="mi sm">R₂</text>
    <line x1="14" y1="90" x2="52" y2="90" class="ln2" stroke="var(--pos)" marker-end="url(#ahg)"></line>
    <text x="0" y="80" class="lbl sm" fill="var(--pos)">I</text>
    <text x="0" y="184" class="lbl sm">One loop, current I = V/(R₁+R₂). R₃ carries nothing ⇒</text>
    <text x="0" y="200" class="lbl sm">it cannot appear in any answer. Then V_{C₁} = I·R₂.</text>
  </g>
</svg>
