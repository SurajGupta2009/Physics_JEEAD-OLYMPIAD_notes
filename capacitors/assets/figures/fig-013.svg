<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 240" role="img" aria-label="Cube of twelve equal capacitors with equipotential classes highlighted" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <g>
    <g stroke="var(--fg)" stroke-width="1.5" fill="none">
      <path d="M120,180 L250,180 L250,80 L120,80 Z"></path>
      <path d="M170,140 L300,140 L300,40 L170,40 Z"></path>
      <path d="M120,180 L170,140 M250,180 L300,140 M250,80 L300,40 M120,80 L170,40"></path>
    </g>
    <g fill="var(--pos)"><circle cx="120" cy="180" r="7"></circle><circle cx="300" cy="40" r="7"></circle></g>
    <text x="98" y="198" class="mi">A</text><text x="308" y="36" class="mi">B</text>
    <g fill="var(--accent)"><circle cx="250" cy="180" r="5.5"></circle><circle cx="120" cy="80" r="5.5"></circle><circle cx="170" cy="140" r="5.5"></circle></g>
    <g fill="var(--violet,#6b3fa0)"><circle cx="250" cy="80" r="5.5"></circle><circle cx="300" cy="140" r="5.5"></circle><circle cx="170" cy="40" r="5.5"></circle></g>
    <text x="30" y="220" class="lbl sm">body diagonal A→B: 3 nodes at one potential (blue),</text>
    <text x="30" y="234" class="lbl sm">3 at another (violet) → the 12 edges become 3 groups of 3</text>
  </g>
  <g transform="translate(380,10)">
    <text x="0" y="16" class="lbl md" style="font-weight:700">Folded network (body diagonal)</text>
    <g stroke="var(--fg)" stroke-width="1.6" fill="none">
      <line x1="30" y1="120" x2="110" y2="60"></line><line x1="30" y1="120" x2="110" y2="120"></line><line x1="30" y1="120" x2="110" y2="180"></line>
      <line x1="110" y1="60" x2="200" y2="120"></line><line x1="110" y1="120" x2="200" y2="120"></line><line x1="110" y1="180" x2="200" y2="120"></line>
    </g>
    <g stroke="var(--accent)" stroke-width="1.6" fill="none">
      <line x1="110" y1="60" x2="200" y2="60"></line><line x1="200" y1="60" x2="290" y2="120"></line>
      <line x1="110" y1="180" x2="200" y2="180"></line><line x1="200" y1="180" x2="290" y2="120"></line>
    </g>
    <g stroke="var(--fg)" stroke-width="1.6" fill="none">
      <line x1="200" y1="60" x2="200" y2="120"></line><line x1="200" y1="120" x2="200" y2="180"></line>
      <line x1="200" y1="60" x2="200" y2="60"></line>
    </g>
    <circle cx="30" cy="120" r="6" fill="var(--pos)"></circle><circle cx="290" cy="120" r="6" fill="var(--pos)"></circle>
    <text x="20" y="106" class="mi">A</text><text x="286" y="106" class="mi">B</text>
    <text x="98" y="52" class="mi sm">P₁</text><text x="98" y="136" class="mi sm">P₂</text><text x="98" y="196" class="mi sm">P₃</text>
    <text x="205" y="52" class="mi sm">Q₁</text><text x="205" y="136" class="mi sm">Q₂</text><text x="205" y="196" class="mi sm">Q₃</text>
    <text x="30" y="212" class="lbl sm">12 edges, each C. Along A–B (body diagonal) three of them are</text>
    <text x="30" y="226" class="lbl sm">in parallel from A to the class P, six connect P to Q, three go Q to B.</text>
  </g>
</svg>
