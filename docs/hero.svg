<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Physics notes for JEE Advanced and the Olympiad track: self-contained HTML chapters from first principles to Olympiad level, each with derivations, diagrams, interleaved questions and a full-length paper.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a45"/><stop offset="1" stop-color="#153a5e"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9.6,5 L0,9 Z" fill="#7fb2e8"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="1192" height="242" rx="20" fill="url(#g)"/>
  <rect x="4.5" y="4.5" width="1191" height="241" rx="20" fill="none" stroke="#2b5d8c" stroke-width="1"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="52" y="78" fill="#eaf2fb" font-size="38" font-weight="700" letter-spacing="-0.4">Physics &#183; JEE Advanced &amp; Olympiad</text>
    <text x="52" y="116" fill="#9fc3e8" font-size="20">Self-contained HTML note-sets: first principles, every step's reasoning, then the Olympiad paper.</text>

    <g fill="#cfe3f7" font-size="14">
      <text x="52" y="160">No CDN &#183; no MathJax &#183; no build step</text>
      <text x="52" y="184">Inline SVG diagrams &#183; hand-built math renderer &#183; prints to PDF</text>
      <text x="52" y="208">One folder per topic &#183; one file per chapter &#183; <tspan fill="#8fd6a8">python3 tools/check_all.py</tspan></text>
    </g>
  </g>

  <!-- the plate/dielectric motif: a capacitor with a slab going in -->
  <g transform="translate(790,62)">
    <rect x="0" y="0" width="360" height="128" rx="14" fill="#0b2138" stroke="#2b5d8c"/>
    <rect x="42" y="26" width="276" height="9" rx="2" fill="#7fb2e8"/>
    <rect x="42" y="93" width="276" height="9" rx="2" fill="#e0a24a"/>
    <rect x="118" y="35" width="104" height="58" rx="4" fill="#2e6da4" opacity="0.42"/>
    <text x="170" y="70" fill="#cfe3f7" font-size="13" text-anchor="middle" font-family="Georgia, serif" font-style="italic">&#954;</text>
    <g stroke="#7fb2e8" stroke-width="1.6" opacity="0.9">
      <line x1="70" y1="41" x2="70" y2="88" marker-end="url(#a)"/>
      <line x1="100" y1="41" x2="100" y2="88" marker-end="url(#a)"/>
      <line x1="240" y1="41" x2="240" y2="88" marker-end="url(#a)"/>
      <line x1="272" y1="41" x2="272" y2="88" marker-end="url(#a)"/>
      <line x1="304" y1="41" x2="304" y2="88" marker-end="url(#a)"/>
    </g>
    <g stroke="#8fd6a8" stroke-width="1.4" stroke-dasharray="4 4">
      <line x1="204" y1="14" x2="264" y2="14" marker-end="url(#a)"/>
    </g>
    <text x="330" y="18" fill="#8fd6a8" font-size="11" font-family="ui-sans-serif, sans-serif" text-anchor="end">x</text>
    <text x="42" y="122" fill="#9fc3e8" font-size="12" font-family="Georgia, serif">F = &#189;V&#178; dC/dx</text>
  </g>
</svg>
