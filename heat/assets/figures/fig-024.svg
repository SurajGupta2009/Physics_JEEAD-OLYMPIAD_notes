<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 230" role="img" aria-label="Fins only pay while the tip stays hot; the exponential-ish decay says: keep them shorter than ~2.5/m and spend metal on perimeter, not on length." xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

<rect x="0.5" y="0.5" width="639" height="229" rx="9" fill="var(--panel2)" stroke="var(--line2)" stroke-width="1" stroke-dasharray="1.5 2.5"></rect>
<text x="320" y="24" text-anchor="middle" class="t2">a fin is a losing battle that still wins: heat leaks out along it, so the gradient (and the harvest) decays</text>
<rect x="70" y="150" width="60" height="40" rx="3" fill="color-mix(in srgb,var(--neg) 20%,var(--panel))" stroke="var(--neg)" stroke-width="1.5"></rect>
<text x="100" y="205" text-anchor="middle" class="t2">base</text>
<rect x="130" y="158" width="380" height="24" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.6"></rect>
<path d="M130,120 C260,128 380,148 510,152" fill="none" stroke="var(--accent)" stroke-width="2"></path>
<line x1="130" y1="152" x2="510" y2="152" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"></line>
<path d="M170,150 L170,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="170,122 174,131 166,131" fill="var(--muted)"></polygon>
<path d="M230,150 L230,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="230,122 234,131 226,131" fill="var(--muted)"></polygon>
<path d="M290,150 L290,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="290,122 294,131 286,131" fill="var(--muted)"></polygon>
<path d="M350,150 L350,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="350,122 354,131 346,131" fill="var(--muted)"></polygon>
<path d="M410,150 L410,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="410,122 414,131 406,131" fill="var(--muted)"></polygon>
<path d="M470,150 L470,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="470,122 474,131 466,131" fill="var(--muted)"></polygon>
<path d="M530,150 L530,131" stroke="var(--muted)" stroke-width="1.1" fill="none"></path><polygon points="530,122 534,131 526,131" fill="var(--muted)"></polygon>
<text x="330" y="110" text-anchor="middle" class="t2">T(x) − T_air = (T_b−T_air) cosh/sinh...: dies over the ‘fin length’ 1/m</text>
<text x="320" y="222" text-anchor="middle" class="t2">m = √(hP/kA_c); if mL ≫ 1 the last half of the fin does nothing — efficiency tanh(mL)/mL = 0.58 at mL = 1.6</text>
</svg>
