<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" role="img" aria-label="The money diagram: a body stores internal energy, not heat; heat and work are the two doors it enters through, and temperature is the pointer every thermometer reads." xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

<rect x="0.5" y="0.5" width="639" height="299" rx="9" fill="var(--panel2)" stroke="var(--line2)" stroke-width="1" stroke-dasharray="1.5 2.5"></rect>
<rect x="40" y="90" width="150" height="170" rx="3" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.7"></rect>
<text x="115" y="78" text-anchor="middle" class="t1">the body: a ledger</text>
<text x="115" y="140" text-anchor="middle" class="t2">internal energy U</text>
<text x="115" y="160" text-anchor="middle" class="t2">molecular KE + PE</text>
<text x="115" y="180" text-anchor="middle" class="t2">T tells its level</text>
<path d="M250,60 L202.604,103.885" stroke="var(--accent)" stroke-width="1.7" fill="none"></path><polygon points="196,110 199.886,100.95 205.321,106.82" fill="var(--accent)"></polygon>
<text x="300" y="55" text-anchor="start" style="font-size:Nonepx;fill:var(--accent)">heat Q</text>
<text x="300" y="72" text-anchor="start" class="t2">energy in transit,</text>
<text x="300" y="86" text-anchor="start" class="t2">because of a ΔT</text>
<path d="M250,240 L204.167,218.781" stroke="var(--pos)" stroke-width="1.7" fill="none"></path><polygon points="196,215 205.848,215.151 202.487,222.411" fill="var(--pos)"></polygon>
<text x="300" y="250" text-anchor="start" style="font-size:Nonepx;fill:var(--pos)">work W</text>
<text x="115" y="286" text-anchor="middle" class="t2">ΔU = Q + W(on) = Q − W(by)</text>
<rect x="430" y="90" width="170" height="86" rx="3" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.7"></rect>
<text x="515" y="120" text-anchor="middle" class="t1">temperature T</text>
<text x="515" y="142" text-anchor="middle" class="t2">a pointer, not a stock</text>
<text x="515" y="156" text-anchor="middle" class="t2">shared by all in contact</text>
<rect x="430" y="200" width="170" height="60" rx="3" fill="var(--panel)" stroke="var(--fg)" stroke-width="1.7"></rect>
<text x="515" y="225" text-anchor="middle" class="t1">heat Q</text>
<text x="515" y="244" text-anchor="middle" class="t2">joules crossing a surface</text>
<line x1="190" y1="155" x2="430" y2="130" stroke="var(--line2)" stroke-width="1.2" stroke-dasharray="4 3"></line>
<line x1="190" y1="155" x2="430" y2="230" stroke="var(--line2)" stroke-width="1.2" stroke-dasharray="4 3"></line>
</svg>
