<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 260" role="img" aria-label="Equal average kinetic energy at equal temperature: helium darts fly faster than nitrogen at 300 K, but the mean translational energy per molecule is the same number, 3kT/2." xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

<rect x="0.5" y="0.5" width="639" height="259" rx="9" fill="var(--panel2)" stroke="var(--line2)" stroke-width="1" stroke-dasharray="1.5 2.5"></rect>
<text x="320" y="26" text-anchor="middle" class="t2">same T ⇒ same mean translational KE, whatever the gas</text>
<circle cx="160" cy="150" r="80" fill="none" stroke="var(--accent)" stroke-width="2"></circle>
<circle cx="480" cy="150" r="80" fill="none" stroke="var(--accent)" stroke-width="2"></circle>
<path d="M206.053,169.471 L219.869,175.312" stroke="var(--fg)" stroke-width="1.4" fill="none"></path><polygon points="228.159,178.817 218.311,178.996 221.427,171.628" fill="var(--fg)"></polygon>
<path d="M153.558,199.583 L151.625,214.458" stroke="var(--fg)" stroke-width="1.4" fill="none"></path><polygon points="150.466,223.383 147.658,213.943 155.592,214.974" fill="var(--fg)"></polygon>
<path d="M111.452,161.962 L96.8877,165.551" stroke="var(--fg)" stroke-width="1.4" fill="none"></path><polygon points="88.1491,167.704 95.9307,161.667 97.8447,169.435" fill="var(--fg)"></polygon>
<path d="M131.259,109.086 L122.636,96.812" stroke="var(--fg)" stroke-width="1.4" fill="none"></path><polygon points="117.463,89.4475 125.91,94.5127 119.363,99.1113" fill="var(--fg)"></polygon>
<path d="M187.719,108.387 L196.034,95.9026" stroke="var(--fg)" stroke-width="1.4" fill="none"></path><polygon points="201.024,88.4122 199.363,98.1201 192.705,93.6851" fill="var(--fg)"></polygon>
<path d="M511.362,156.357 L522.143,158.543" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="530.963,160.331 521.348,162.463 522.938,154.623" fill="var(--muted)"></polygon>
<path d="M491.595,179.825 L495.581,190.078" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="498.843,198.466 491.853,191.527 499.31,188.628" fill="var(--muted)"></polygon>
<path d="M456.403,171.615 L448.292,179.045" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="441.656,185.124 445.59,176.095 450.994,181.994" fill="var(--muted)"></polygon>
<path d="M451.304,135.839 L441.439,130.972" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="433.369,126.989 443.209,127.385 439.669,134.559" fill="var(--muted)"></polygon>
<path d="M482.8,118.123 L483.762,107.165" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="484.55,98.1994 487.747,107.515 479.778,106.815" fill="var(--muted)"></polygon>
<path d="M509.679,138.036 L519.882,133.923" stroke="var(--muted)" stroke-width="1.4" fill="none"></path><polygon points="528.229,130.558 521.377,137.633 518.386,130.213" fill="var(--muted)"></polygon>
<text x="160" y="66" text-anchor="middle" class="t1">He, 300 K</text>
<text x="480" y="66" text-anchor="middle" class="t1">N₂, 300 K</text>
<text x="160" y="155" text-anchor="middle" class="t2">light · fast</text>
<text x="480" y="155" text-anchor="middle" class="t2">heavy · slow</text>
<text x="160" y="246" text-anchor="middle" class="t2">mean ½m∐v²∑ = 3kT/2 = 6.2×10⁻²¹ J</text>
<text x="480" y="246" text-anchor="middle" class="t2">mean ½m∐v²∑ = exactly the same</text>
</svg>
