<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 240" role="img" aria-label="Reflection of wave pulse at fixed and free boundaries" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8; --pos:#0b7a4b; --neg:#b3261e; }
.ln { stroke:var(--fg); stroke-width:1.8; fill:none; }
.str { stroke:var(--accent); stroke-width:3; fill:none; }
.wall { fill:#e2e2e0; stroke:var(--fg); stroke-width:2; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.bld { font-weight:bold; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
</style>
<defs>
  <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#777" stroke-width="1.5" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Panel A: Fixed Boundary -->
<text x="50" y="30" class="lbl bld">Case (a): Fixed End (Inversion, Δφ = π)</text>
<!-- Wall -->
<rect x="300" y="45" width="20" height="150" fill="url(#hatch)" stroke="#1c1c1a" stroke-width="2"/>
<!-- Equilibrium line -->
<line x1="50" y1="120" x2="300" y2="120" stroke="#aaa" stroke-dasharray="4 4"/>
<!-- Reflected inverted pulse -->
<path d="M 50 120 L 140 120 Q 180 170 220 120 L 300 120" class="str"/>
<circle cx="300" cy="120" r="5" fill="#1c1c1a"/>
<text x="170" y="195" class="lbl" fill="#b3261e">Reflected (inverted)</text>

<!-- Panel B: Free Boundary -->
<text x="400" y="30" class="lbl bld">Case (b): Free End (No Inversion, Δφ = 0)</text>
<!-- Vertical smooth rod -->
<line x1="650" y1="45" x2="650" y2="195" stroke="#1c1c1a" stroke-width="3"/>
<!-- Equilibrium line -->
<line x1="400" y1="120" x2="650" y2="120" stroke="#aaa" stroke-dasharray="4 4"/>
<!-- Reflected erect pulse -->
<path d="M 400 120 L 490 120 Q 530 70 570 120 L 650 120" class="str"/>
<!-- Light frictionless ring at rod -->
<circle cx="650" cy="120" r="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="500" y="60" class="lbl" fill="#0b7a4b">Reflected (erect, 2A at antinode)</text>
</svg>