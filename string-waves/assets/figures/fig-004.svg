<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 240" role="img" aria-label="Pulse traveling up a suspended heavy rope under gravity" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8; --pos:#0b7a4b; --neg:#b3261e; }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; }
.str { stroke:var(--accent); stroke-width:3; fill:none; }
.lbl { font-family:Arial,sans-serif; font-size:12px; fill:var(--fg); }
.lbl.bld { font-weight:bold; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:13px; fill:var(--fg); }
</style>
<defs>
  <pattern id="hatch2" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1.2" />
  </pattern>
  <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1f5fa8"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Ceiling / Rig -->
<rect x="220" y="20" width="160" height="15" fill="url(#hatch2)" stroke="#1c1c1a" stroke-width="1.5"/>
<line x1="220" y1="35" x2="380" y2="35" stroke="#1c1c1a" stroke-width="2"/>

<!-- Rope hanging down -->
<path d="M 300 35 L 300 110 Q 330 140 300 170 L 300 215" class="str"/>
<!-- Pulse moving up -->
<line x1="345" y1="155" x2="345" y2="120" stroke="#1f5fa8" stroke-width="2" marker-end="url(#arr2)"/>
<text x="355" y="140" class="mi" fill="#1f5fa8">v(y) = √(gy)</text>

<!-- Height markers -->
<line x1="260" y1="35" x2="260" y2="215" stroke="#aaa" stroke-dasharray="3 3"/>
<line x1="250" y1="35" x2="270" y2="35" stroke="#aaa"/>
<line x1="250" y1="215" x2="270" y2="215" stroke="#aaa"/>
<text x="210" y="130" class="mi">y = L</text>
<text x="220" y="220" class="mi">y = 0</text>

<!-- Info Box -->
<rect x="440" y="45" width="230" height="150" rx="6" fill="#f8f9fa" stroke="#ccd0d5" stroke-width="1.2"/>
<text x="455" y="70" class="lbl bld">Hanging Rope Dynamics</text>
<text x="455" y="95" class="lbl">Tension: T(y) = μ g y</text>
<text x="455" y="120" class="lbl">Speed: v(y) = dy/dt = √(gy)</text>
<text x="455" y="145" class="lbl">Travel time bottom → top:</text>
<text x="475" y="170" class="mi" fill="#1f5fa8">t = 2 √(L / g)</text>
</svg>