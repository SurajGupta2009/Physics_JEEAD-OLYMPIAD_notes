<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 320" role="img" aria-label="Decision tree for classifying a wave optics problem" xmlns="http://www.w3.org/2000/svg">
<style>
:root { --panel:#ffffff; --fg:#1c1c1a; --muted:#5f5c54; --accent:#1f5fa8;
  --pos:#0b7a4b; --neg:#b3261e; --amber:#8a5a00; --violet:#6b3fa0; }
.w { fill:var(--panel); }
.ln { stroke:var(--fg); stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.ln2 { stroke:var(--fg); stroke-width:2.6; fill:none; stroke-linecap:round; }
.thinl { stroke:var(--muted); stroke-width:1; fill:none; stroke-dasharray:4 3; stroke-linecap:round; }
.acc { stroke:var(--accent); stroke-width:1.8; fill:none; }
.facc { fill:var(--accent); opacity:.14; stroke:var(--accent); stroke-width:1.4; }
.fneg { fill:var(--neg); opacity:.13; stroke:var(--neg); stroke-width:1.4; }
.fp { fill:#edf4fb; stroke:var(--accent); stroke-width:1.6; }
.fn { fill:#fbeeed; stroke:var(--neg); stroke-width:1.6; }
.fld { stroke:var(--accent); stroke-width:1.4; fill:none; opacity:.85; }
.lbl { font-family:Arial,sans-serif; font-size:13px; fill:var(--fg); }
.lbl.sm { font-size:11px; fill:var(--muted); }
.lbl.md { font-size:12px; }
.mi { font-family:Georgia,serif; font-style:italic; font-size:14px; fill:var(--fg); }
.mi.sm { font-size:11.5px; fill:var(--muted); }
.eq0 { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:2 4; }
.mtext { font-family:Georgia,serif; font-size:13px; fill:var(--fg); }
.hi { fill:var(--amber); opacity:.16; stroke:var(--amber); stroke-width:1.3; }
.pos { fill:var(--pos); } .negc { fill:var(--neg); }
line.mk,path.mk { stroke:var(--fg); stroke-width:1.4; }
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--fg)"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--neg)"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9.6,5 L0,9 Z" fill="var(--pos)"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1.4 L8.6,5 L1,8.6" fill="none" stroke="var(--fg)" stroke-width="1.8"/></marker>
<marker id="dim" viewBox="0 0 8 12" refX="4" refY="6" markerWidth="7" markerHeight="10" orient="auto"><path d="M4,0 L4,12" stroke="var(--muted)" stroke-width="1.1"/></marker>
</defs>

  <rect x="250" y="10" width="200" height="34" rx="8" class="fp"></rect>
  <text x="350" y="32" class="lbl md" text-anchor="middle">read the question</text>
  <line x1="350" y1="44" x2="350" y2="66" class="ln"></line>
  <line x1="70" y1="66" x2="630" y2="66" class="ln"></line>
  <g>
    <line x1="70" y1="66" x2="70" y2="88" class="ln"></line><line x1="182" y1="66" x2="182" y2="88" class="ln"></line>
    <line x1="294" y1="66" x2="294" y2="88" class="ln"></line><line x1="406" y1="66" x2="406" y2="88" class="ln"></line>
    <line x1="518" y1="66" x2="518" y2="88" class="ln"></line><line x1="630" y1="66" x2="630" y2="88" class="ln"></line>
  </g>
  <g class="facc">
    <rect x="18" y="88" width="104" height="40" rx="6"></rect><rect x="130" y="88" width="104" height="40" rx="6"></rect>
    <rect x="242" y="88" width="104" height="40" rx="6"></rect><rect x="354" y="88" width="104" height="40" rx="6"></rect>
    <rect x="466" y="88" width="104" height="40" rx="6"></rect><rect x="578" y="88" width="104" height="40" rx="6"></rect>
  </g>
  <g class="lbl sm" text-anchor="middle">
    <text x="70" y="104">two sources</text><text x="70" y="118">“slits”</text>
    <text x="182" y="104">a film or</text><text x="182" y="118">a thin layer</text>
    <text x="294" y="104">one aperture</text><text x="294" y="118">“slit”, “hole”</text>
    <text x="406" y="104">many slits</text><text x="406" y="118">“grating”</text>
    <text x="518" y="104">polarisation</text><text x="518" y="118">“filter”</text>
    <text x="630" y="104">instruments</text><text x="630" y="118">“telescope”</text>
  </g>
  <g class="lbl sm" text-anchor="middle">
    <text x="70" y="156">Δx = d sinθ</text><text x="70" y="172">β = λD/d</text>
    <text x="182" y="156">2μt cos r</text><text x="182" y="172">+ λ/2 if one flip</text>
    <text x="294" y="156">a sinθ = mλ</text><text x="294" y="172">(dark!)</text>
    <text x="406" y="156">d sinθ = nλ</text><text x="406" y="172">R = nN</text>
    <text x="518" y="156">I = I₀cos²θ</text><text x="518" y="172">tanθₖ = n₂/n₁</text>
    <text x="630" y="156">1.22λ/D</text><text x="630" y="172">0.61λ/NA</text>
  </g>
  <g class="ln" fill="none">
    <line x1="70" y1="184" x2="70" y2="206"></line><line x1="182" y1="184" x2="182" y2="206"></line>
    <line x1="294" y1="184" x2="294" y2="206"></line><line x1="406" y1="184" x2="406" y2="206"></line>
    <line x1="518" y1="184" x2="518" y2="206"></line><line x1="630" y1="184" x2="630" y2="206"></line>
  </g>
  <g class="lbl sm" text-anchor="middle">
    <text x="70" y="222">check D from the</text><text x="70" y="236">virtual sources!</text>
    <text x="182" y="222">count the</text><text x="182" y="236">reflections</text>
    <text x="294" y="222">minima here,</text><text x="294" y="236">maxima at θ=0</text>
    <text x="406" y="222">n_max = d/λ</text><text x="406" y="236">missing orders</text>
    <text x="518" y="222">transverse wave:</text><text x="518" y="236">project the field</text>
    <text x="630" y="222">aperture, not</text><text x="630" y="236">magnification</text>
  </g>
  <rect x="120" y="262" width="460" height="46" rx="8" class="fneg"></rect>
  <text x="350" y="282" class="lbl md" text-anchor="middle">if the question mentions a NUMBER for a thickness, an index or a wavelength,</text>
  <text x="350" y="300" class="lbl md" text-anchor="middle">the answer is a path difference in wavelengths: convert to waves and count.</text>
</svg>
