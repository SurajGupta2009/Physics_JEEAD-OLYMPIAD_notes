  <polyline class="thinl" fill="none" points="270,200 275,182 282,178 290,172 300,164 310,148 320,117 330,50 390,50 400,117 410,148 424,168 440,178 460,186 490,192 520,195 560,197 600,198 640,198"></polyline>
  <text x="360" y="42" class="lbl sm" text-anchor="middle">central maximum: half-width λ<tspan class="mi">D</tspan>/<tspan class="mi">a</tspan></text>
  <text x="180" y="120" class="lbl sm">secondary maxima</text>
  <text x="180" y="138" class="lbl sm">4.7%, 1.7%, 0.8%…</text>
  <text x="200" y="228" class="lbl sm">minima at a sin θ = mλ: equally spaced here, because sin θ ≈ θ</text>
