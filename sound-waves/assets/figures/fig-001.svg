<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
<style>
  .axis{stroke:#222;stroke-width:1.2;fill:none}
  .grid{stroke:#e2ded4;stroke-width:0.6;stroke-dasharray:3 3}
  .wave{stroke:#1f5fa8;stroke-width:2.2;fill:none}
  .wave2{stroke:#c0392b;stroke-width:2.2;fill:none}
  .lbl{font-family:serif;font-size:14px;fill:#1c1c1a}
  .sm{font-size:12px;fill:#5f5c54}
  .dot{fill:#1f5fa8}
</style>
<!-- Title -->
<text x="10" y="18" class="lbl">Longitudinal wave: displacement s(x) and pressure ΔP(x) at fixed t</text>
<!-- axes -->
<line x1="60" y1="90" x2="760" y2="90" class="axis"/>
<line x1="60" y1="200" x2="760" y2="200" class="axis"/>
<text x="30" y="95" class="lbl">s</text>
<text x="20" y="205" class="lbl">ΔP</text>
<!-- grid -->
<line x1="60" y1="90" x2="60" y2="90" class="grid"/>
<!-- displacement sine -->
<path d="M60,90 Q95,50 130,90 T260,90 T390,90 T520,90 T650,90 T760,90" class="wave"/>
<!-- pressure cosine (shifted) -->
<path d="M60,160 Q95,120 130,160 Q165,200 200,160 T330,160 T460,160 T590,160 T720,160" class="wave2"/>
<!-- annotations -->
<text x="140" y="70" class="sm">s = s0 sin(kx)</text>
<text x="140" y="135" class="sm" fill="#c0392b">ΔP = ΔP0 cos(kx) = -B ds/dx</text>
<line x1="130" y1="90" x2="130" y2="200" stroke="#999" stroke-dasharray="4 3"/>
<text x="125" y="240" class="sm">displacement node → pressure antinode</text>
<text x="200" y="260" class="sm">Where s=0, slope max → compression max. Pressure leads displacement by π/2</text>
<!-- particle positions -->
<g>
  <circle cx="80" cy="280" r="3" class="dot"/>
  <circle cx="100" cy="280" r="3" class="dot"/>
  <circle cx="115" cy="280" r="3" class="dot"/>
  <circle cx="125" cy="280" r="3" class="dot"/>
  <circle cx="145" cy="280" r="3" class="dot"/>
  <circle cx="170" cy="280" r="3" class="dot"/>
  <circle cx="195" cy="280" r="3" class="dot"/>
  <circle cx="215" cy="280" r="3" class="dot"/>
  <circle cx="235" cy="280" r="3" class="dot"/>
  <circle cx="255" cy="280" r="3" class="dot"/>
  <circle cx="280" cy="280" r="3" class="dot"/>
  <text x="60" y="300" class="sm">equilibrium → compressed (C) / rarefied (R) regions</text>
  <text x="110" y="295" class="sm">C</text>
  <text x="180" y="295" class="sm">R</text>
  <text x="250" y="295" class="sm">C</text>
</g>
</svg>
