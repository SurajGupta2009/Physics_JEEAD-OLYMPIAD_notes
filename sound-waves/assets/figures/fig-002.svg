<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
<style>
  .axis{stroke:#222;stroke-width:1.2}
  .box{fill:#e8f0f9;stroke:#1f5fa8;stroke-width:1.2}
  .lbl{font-family:serif;font-size:14px;fill:#1c1c1a}
  .sm{font-size:12px;fill:#5f5c54}
  .force{stroke:#c0392b;stroke-width:1.8;marker-end:url(#ah)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<text x="10" y="18" class="lbl">Derivation: speed of sound from a gas slab of thickness dx</text>
<!-- slab -->
<rect x="200" y="80" width="300" height="120" class="box"/>
<line x1="200" y1="70" x2="200" y2="210" class="axis"/>
<line x1="500" y1="70" x2="500" y2="210" class="axis"/>
<text x="210" y="75" class="sm">x</text>
<text x="470" y="75" class="sm">x+dx</text>
<text x="320" y="145" class="lbl">gas element ρ A dx, Bulk modulus B</text>
<text x="320" y="165" class="sm">pressure left P+ΔP(x), right P+ΔP(x+dx)</text>
<!-- forces -->
<line x1="180" y1="120" x2="200" y2="120" class="force"/>
<line x1="520" y1="120" x2="500" y2="120" class="force"/>
<text x="120" y="115" class="sm">F = P A</text>
<text x="525" y="115" class="sm">F+ dF</text>
<!-- displacement -->
<line x1="200" y1="220" x2="260" y2="220" stroke="#1f5fa8" stroke-width:1.5" marker-end="url(#ah)"/>
<text x="210" y="240" class="sm">s(x,t)</text>
<line x1="500" y1="220" x2="560" y2="220" stroke="#1f5fa8" stroke-width:1.5" marker-end="url(#ah)"/>
<text x="510" y="240" class="sm">s+ (∂s/∂x)dx</text>
<text x="60" y="280" class="lbl">Net force = -A ∂(ΔP)/∂x dx = A B ∂²s/∂x² dx</text>
<text x="60" y="300" class="lbl">Newton: ρ A dx ∂²s/∂t² = A B ∂²s/∂x² dx → v = √(B/ρ)</text>
<text x="60" y="320" class="sm">Condition: linear elasticity, small strain |∂s/∂x| ≪1, lossless, homogeneous</text>
</svg>
